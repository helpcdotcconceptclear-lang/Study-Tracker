        }

        function animateDashboardProgressGraph(isMonth) {
            const card = document.getElementById('weekly-progress-card');
            if (!card) return;

            const svg = card.querySelector('svg');
            if (!svg) return;

            const token = ++progressGraphAnimationToken;
            const currentOffset = isMonth ? monthOffset : appState.weekOffset;
            const previousOffset = currentOffset - 1;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const titleEl = card.querySelector('h4');
            const currentTitle = titleEl ? titleEl.textContent.trim() : '';

            const toLocalDateKeyAnim = (date) => {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            };
            const activityAnim = (date) => {
                const log = appState.dailyLogs?.[toLocalDateKeyAnim(date)];
                if (!log || typeof log !== 'object') return 0;
                if (Number.isFinite(Number(log.total))) return Math.max(0, Number(log.total));
                return Math.max(0, (Number(log.cq) || 0) + (Number(log.mcq) || 0) + (Number(log.sq) || 0));
            };
            const smoothAnim = (points, width, height = 100) => {
                if (!points.length) return '';
                if (points.length === 1) return `M ${points[0].x} ${points[0].y}`;
                let d = `M ${points[0].x} ${points[0].y}`;
                for (let i = 0; i < points.length - 1; i++) {
                    const p0 = points[i - 1] || points[i];
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    const p3 = points[i + 2] || p2;
                    // Keep each Bézier segment's control points horizontally
                    // inside its own two data-point boundaries. This preserves
                    // the existing smooth curve while preventing the final
                    // segment from travelling past the last calendar-day point
                    // and then returning to it.
                    const segmentMinX = Math.min(p1.x, p2.x);
                    const segmentMaxX = Math.max(p1.x, p2.x);
                    const cp1x = Math.max(segmentMinX, Math.min(segmentMaxX, p1.x + (p2.x - p0.x) / 6));
                    const cp1y = Math.max(0, Math.min(height, p1.y + (p2.y - p0.y) / 6));
                    const cp2x = Math.max(segmentMinX, Math.min(segmentMaxX, p2.x - (p3.x - p1.x) / 6));
                    const cp2y = Math.max(0, Math.min(height, p2.y - (p3.y - p1.y) / 6));
                    d += ` C ${cp1x},${cp1y}, ${cp2x},${cp2y}, ${p2.x},${p2.y}`;
                }
                return d;
            };

            let dates = [], coords = [], graphWidth = 300;
            if (isMonth) {
                dates = getMonthlyGraphDates(previousOffset);
                const raw = dates.map(activityAnim);
                // The previous-month animation is intentionally limited to the
                // first 27 calendar days. Keep the full month's coordinate space
                // so every day retains its real horizontal position, but reveal
                // and scroll only through day 27.
                const animationDayCount = Math.min(27, dates.length);
                const max = Math.max(1, ...raw.slice(0, animationDayCount));
                graphWidth = Math.max(300, (dates.length * 28) + 28);
                const pad = 14;
                const plotWidth = Math.max(0, graphWidth - pad * 2);
                const step = dates.length > 1 ? plotWidth / (dates.length - 1) : 0;
                const allCoords = dates.map((date, idx) => ({
                    x: Number((pad + idx * step).toFixed(2)),
                    y: Number((90 - (Math.min(raw[idx], max) / max) * 70).toFixed(2))
                }));
                coords = allCoords.slice(0, animationDayCount);
            } else {
                const start = new Date(today);
                const daysFromSaturday = (today.getDay() + 1) % 7;
                start.setDate(start.getDate() - daysFromSaturday + previousOffset * 7);
                dates = Array.from({length: 7}, (_, i) => {
                    const d = new Date(start);
                    d.setDate(start.getDate() + i);
                    return d;
                });
                const raw = dates.map(activityAnim);
                const max = Math.max(1, ...raw);
                coords = raw.map((value, idx) => ({
                    x: [10,55,100,145,190,235,280][idx],
                    y: Number((90 - (Math.min(value, max) / max) * 70).toFixed(2))
                }));
            }

            const pathD = smoothAnim(coords, graphWidth);
            if (!pathD) return;

            const monthScroll = isMonth ? document.getElementById('monthly-graph-scroll') : null;
            const graphLayer = monthScroll ? monthScroll.firstElementChild : svg.parentElement;
            if (!graphLayer) return;

            const overlay = svg.cloneNode(true);
            overlay.removeAttribute('id');
            overlay.style.position = 'absolute';
            overlay.style.left = '0';
            overlay.style.top = '0';
            overlay.style.width = isMonth ? `${graphWidth}px` : '100%';
            overlay.style.height = '136px';
            overlay.style.minWidth = isMonth ? `${graphWidth}px` : '100%';
            overlay.style.pointerEvents = 'none';
            overlay.style.zIndex = '5';
            overlay.style.overflow = 'visible';

            // Keep the starting dot fixed at the first graph point, but make
            // the final dot travel with the animated line endpoint. This keeps
            // the dot physically attached to the visible end of the curve.
            overlay.querySelectorAll('circle').forEach(c => c.remove());
            let animatedEndpointDot = null;
            const addEndpointDots = () => {
                if (!coords.length) return;
                const ns = 'http://www.w3.org/2000/svg';
                const first = document.createElementNS(ns, 'circle');
                first.setAttribute('cx', coords[0].x);
                first.setAttribute('cy', coords[0].y);
                first.setAttribute('r', '4');
                first.setAttribute('fill', '#06b6d4');
                first.setAttribute('stroke', '#ffffff');
                first.setAttribute('stroke-width', '2');
                overlay.appendChild(first);

                if (coords.length > 1) {
                    animatedEndpointDot = document.createElementNS(ns, 'circle');
                    animatedEndpointDot.setAttribute('cx', coords[0].x);
                    animatedEndpointDot.setAttribute('cy', coords[0].y);
                    animatedEndpointDot.setAttribute('r', '4');
                    animatedEndpointDot.setAttribute('fill', '#06b6d4');
                    animatedEndpointDot.setAttribute('stroke', '#ffffff');
                    animatedEndpointDot.setAttribute('stroke-width', '2');
                    overlay.appendChild(animatedEndpointDot);
                }
            };

            const existingPaths = Array.from(overlay.querySelectorAll('path'));
            const linePath = existingPaths.find(p => p.getAttribute('fill') === 'none') || existingPaths[existingPaths.length - 1];
            const areaPath = existingPaths.find(p => {
                const fill = p.getAttribute('fill') || '';
                return fill.includes('grad-turquoise');
            }) || null;
            if (!linePath) return;

            linePath.setAttribute('d', pathD);
            linePath.setAttribute('stroke', '#06b6d4');
            linePath.setAttribute('fill', 'none');
            linePath.setAttribute('stroke-width', '3');
            linePath.setAttribute('stroke-linecap', 'round');
            linePath.style.opacity = '1';
            addEndpointDots();

            let areaReveal = null;
            if (areaPath) {
                areaPath.setAttribute('d', `${pathD} L ${coords[coords.length - 1].x} 100 L ${coords[0].x} 100 Z`);
                areaPath.style.opacity = '0.25';

                const defs = overlay.querySelector('defs') || (() => {
                    const d = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                    overlay.insertBefore(d, overlay.firstChild);
                    return d;
                })();
                const clip = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
                const clipId = `progressAreaReveal-${token}`;
                clip.setAttribute('id', clipId);
                areaReveal = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                areaReveal.setAttribute('x', '0');
                areaReveal.setAttribute('y', '0');
                areaReveal.setAttribute('width', '0');
                areaReveal.setAttribute('height', '100');
                clip.appendChild(areaReveal);
                defs.appendChild(clip);
                areaPath.setAttribute('clip-path', `url(#${clipId})`);
            }

            const currentSvgOpacity = svg.style.opacity;
            svg.style.opacity = '0';
            const previousOverflow = graphLayer.style.overflow;
            const previousPosition = graphLayer.style.position;
            if (getComputedStyle(graphLayer).position === 'static') graphLayer.style.position = 'relative';
            graphLayer.style.overflow = 'visible';
            graphLayer.appendChild(overlay);

            if (monthScroll) monthScroll.scrollLeft = 0;

            const length = Math.max(1, linePath.getTotalLength());
            linePath.style.strokeDasharray = `${length}`;
            linePath.style.strokeDashoffset = `${length}`;

            const drawDuration = isMonth ? 1700 : 900;
            const slideDuration = isMonth ? 520 : 420;
            const currentDrawDuration = isMonth ? 1200 : 760;
            const ease = t => 1 - Math.pow(1 - t, 3);
            const drawStart = performance.now();

            if (titleEl) titleEl.textContent = isMonth
                ? getMonthLabel(dates[0] || today)
                : 'Pre Week';

            let cancelled = false;
            const cleanup = () => {
                if (overlay.parentNode) overlay.remove();
                svg.style.opacity = currentSvgOpacity;
                graphLayer.style.overflow = previousOverflow;
                graphLayer.style.position = previousPosition;
                if (titleEl) titleEl.textContent = currentTitle;
                if (activeProgressGraphAnimationCancel === cancel) activeProgressGraphAnimationCancel = null;
            };

            const cancel = () => {
                if (cancelled || token !== progressGraphAnimationToken) return;
                cancelled = true;
                progressGraphAnimationToken++;
                if (monthScroll) monthScroll.scrollLeft = Math.max(0,
                    Math.min(monthScroll.scrollWidth - monthScroll.clientWidth,
                        Math.max(0, (today.getDate() - 1) - 10) * 28));
                cleanup();
            };
            activeProgressGraphAnimationCancel = cancel;

            const animateCurrentGraph = () => {
                if (token !== progressGraphAnimationToken || cancelled) return;

                // The period/title has now changed first. Only after that is the
                // current graph made visible and its line animation started.
                if (overlay.parentNode) overlay.remove();
                svg.style.opacity = '1';
                if (titleEl) titleEl.textContent = currentTitle;

                const currentPaths = Array.from(svg.querySelectorAll('path'));
                const currentLine = currentPaths.find(p => p.getAttribute('fill') === 'none') ||
                                    currentPaths[currentPaths.length - 1];
                if (!currentLine) {
                    cleanup();
                    return;
                }

                const currentLength = Math.max(1, currentLine.getTotalLength());
                currentLine.style.strokeDasharray = `${currentLength}`;
                currentLine.style.strokeDashoffset = `${currentLength}`;

                // Hide the existing endpoint dots only until the current-page
                // animation begins; then reveal them with the graph.
                const currentDots = Array.from(svg.querySelectorAll('circle'));
                const currentEndpointDot = currentDots.length > 1 ? currentDots[currentDots.length - 1] : null;
                currentDots.forEach(c => c.style.opacity = '1');

                // The starting dot must remain visible. The final dot starts
                // exactly at the first point and follows the line endpoint.
                if (currentEndpointDot) {
                    const startPoint = currentLine.getPointAtLength(0);
                    currentEndpointDot.setAttribute('cx', startPoint.x);
                    currentEndpointDot.setAttribute('cy', startPoint.y);
                }

                const currentArea = currentPaths.find(p => {
                    const fill = p.getAttribute('fill') || '';
                    return fill.includes('grad-turquoise');
                }) || null;

                // Current-month area reveal is synchronized with the line by using
                // the exact same path-length progress point.
                let currentAreaReveal = null;
                if (currentArea) {
                    const defs = svg.querySelector('defs') || (() => {
                        const d = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                        svg.insertBefore(d, svg.firstChild);
                        return d;
                    })();
                    const clip = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
                    const clipId = `currentProgressAreaReveal-${token}`;
                    clip.setAttribute('id', clipId);
                    currentAreaReveal = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    currentAreaReveal.setAttribute('x', '0');
                    currentAreaReveal.setAttribute('y', '0');
                    currentAreaReveal.setAttribute('width', '0');
                    currentAreaReveal.setAttribute('height', '100');
                    clip.appendChild(currentAreaReveal);
                    defs.appendChild(clip);
                    currentArea.setAttribute('clip-path', `url(#${clipId})`);
                    currentArea.style.opacity = '0';
                }

                // Current Month auto-scroll target:
                // keep four complete empty calendar days after the final progress
                // day. The right edge therefore reaches the fifth calendar-day
                // slot after the animated endpoint (e.g. day 19 -> day 24).
                const currentMonthScrollMetrics = (() => {
                    if (!isMonth || !monthScroll) return null;
                    const datesCount = dates.length;
                    const graphPad = 14;
                    const plotWidth = Math.max(0, graphWidth - graphPad * 2);
                    const dayStep = datesCount > 1 ? plotWidth / (datesCount - 1) : 0;
                    const maxScroll = Math.max(0, monthScroll.scrollWidth - monthScroll.clientWidth);
                    return { dayStep, maxScroll, viewportWidth: monthScroll.clientWidth };
                })();

                const updateCurrentMonthAutoScroll = (progressPointX) => {
                    if (!currentMonthScrollMetrics) return;
                    const { dayStep, maxScroll, viewportWidth } = currentMonthScrollMetrics;
                    const requiredRightEdgeX = progressPointX + (dayStep * 5);
                    const targetScroll = Math.max(
                        0,
                        Math.min(maxScroll, requiredRightEdgeX - viewportWidth)
                    );

                    // Only move right when the viewport does not already contain
                    // the required empty space. Never move left during this run.
                    if (targetScroll > monthScroll.scrollLeft) {
                        monthScroll.scrollLeft = targetScroll;
                    }
                };

                const start = performance.now();
                const tickCurrent = (ts) => {
                    if (token !== progressGraphAnimationToken || cancelled) return;
                    const q = ease(Math.min(1, (ts - start) / currentDrawDuration));
                    const progressLength = Math.min(currentLength, currentLength * q);
                    const progressPoint = currentLine.getPointAtLength(progressLength);

                    currentLine.style.strokeDashoffset = `${currentLength * (1 - q)}`;

                    if (currentEndpointDot) {
                        currentEndpointDot.setAttribute('cx', progressPoint.x);
                        currentEndpointDot.setAttribute('cy', progressPoint.y);
                    }

                    if (currentAreaReveal) {
                        currentAreaReveal.setAttribute('width', `${Math.max(0, progressPoint.x)}`);
                        currentArea.style.opacity = '0.25';
                    }

                    if (isMonth && monthScroll) {
                        updateCurrentMonthAutoScroll(progressPoint.x);
                    }

                    currentDots.forEach(c => c.style.opacity = '1');

                    if (q < 1) requestAnimationFrame(tickCurrent);
                    else {
                        currentLine.style.strokeDashoffset = '0';
                        const endPoint = currentLine.getPointAtLength(currentLength);
                        if (currentEndpointDot) {
                            currentEndpointDot.setAttribute('cx', endPoint.x);
                            currentEndpointDot.setAttribute('cy', endPoint.y);
                        }
                        if (currentAreaReveal) {
                            currentAreaReveal.setAttribute('width', `${Math.max(0, endPoint.x)}`);
                            currentArea.style.opacity = '0.25';
                        }
                        if (isMonth && monthScroll) {
                            updateCurrentMonthAutoScroll(endPoint.x);
                        }
                        currentDots.forEach(c => c.style.opacity = '1');
                        if (activeProgressGraphAnimationCancel === cancel) activeProgressGraphAnimationCancel = null;
                    }
                };
                requestAnimationFrame(tickCurrent);
            };

            const finishPrevious = () => {
                if (token !== progressGraphAnimationToken || cancelled) return;

                if (isMonth) {
                    // Previous month always ends at day 27, regardless of whether
                    // that month has 28, 29, 30 or 31 calendar days.
                    if (monthScroll) {
                        const maxScroll = Math.max(0, monthScroll.scrollWidth - monthScroll.clientWidth);
                        const day27X = coords.length ? coords[coords.length - 1].x : 0;
                        const rightEdgePadding = 4;
                        const day27ScrollTarget = Math.max(
                            0,
                            Math.min(maxScroll, day27X - monthScroll.clientWidth + rightEdgePadding)
                        );
                        // Hold exactly at the day-27 boundary for the transition;
                        // do not jump to the absolute right edge of the full month.
                        monthScroll.scrollLeft = day27ScrollTarget;
                    }

                    // Move the page state to the current month first, while the
                    // current graph remains hidden. Then return the horizontal
                    // viewport all the way to the absolute left edge before
                    // starting the current-month graph animation.
                    if (titleEl) titleEl.textContent = currentTitle;
                    const startReset = () => {
                        if (token !== progressGraphAnimationToken || cancelled) return;
                        const resetStart = performance.now();
                        const startScroll = monthScroll ? monthScroll.scrollLeft : 0;
                        const reset = (ts) => {
                            if (token !== progressGraphAnimationToken || cancelled) return;
                            const q = ease(Math.min(1, (ts - resetStart) / slideDuration));
                            if (monthScroll) {
                                const maxScroll = Math.max(0, monthScroll.scrollWidth - monthScroll.clientWidth);
                                monthScroll.scrollLeft = Math.max(0, Math.min(maxScroll, startScroll * (1 - q)));
                            }
                            if (q < 1) requestAnimationFrame(reset);
                            else {
                                if (monthScroll) monthScroll.scrollLeft = 0;
                                animateCurrentGraph();
                            }
                        };
                        requestAnimationFrame(reset);
                    };
                    requestAnimationFrame(startReset);
                    return;
                }

                // Week view: finish drawing the previous week first. Then change
                // the page/title and only after that start This Week's graph.
                if (overlay.parentNode) overlay.remove();
                svg.style.opacity = '0';
                if (titleEl) titleEl.textContent = currentTitle;

                requestAnimationFrame(() => {
                    if (token !== progressGraphAnimationToken || cancelled) return;
                    animateCurrentGraph();
                });
            };

            // Month graph touch/scroll must immediately cancel the animation.
            if (monthScroll) {
                monthScroll.addEventListener('touchstart', cancel, { once: true, passive: true });
            }

            const tick = (now) => {
                if (token !== progressGraphAnimationToken || cancelled) return;
                const elapsed = now - drawStart;
                const p = ease(Math.min(1, elapsed / drawDuration));

                linePath.style.strokeDashoffset = `${length * (1 - p)}`;

                // Animate the final dot together with the line. getPointAtLength()
                // guarantees that the dot remains exactly on the currently
                // revealed end of the Bézier path instead of staying at the
                // destination until the line reaches it.
                if (animatedEndpointDot) {
                    const point = linePath.getPointAtLength(Math.min(length, length * p));
                    animatedEndpointDot.setAttribute('cx', point.x);
                    animatedEndpointDot.setAttribute('cy', point.y);
                }

                if (areaReveal) {
                    // Reveal the area to the exact same geometric endpoint as
                    // the line. Using the line's current path point keeps both
                    // animations perfectly synchronized in time and progress.
                    const progressPoint = linePath.getPointAtLength(Math.min(length, length * p));
                    const revealWidth = Math.max(0, Math.min(graphWidth, progressPoint.x));
                    areaReveal.setAttribute('width', `${revealWidth}`);
                }

                if (monthScroll) {
                    const maxScroll = Math.max(0, monthScroll.scrollWidth - monthScroll.clientWidth);
                    // Previous-month animation is capped at day 27. Keep day 27
                    // as the rightmost visible animated point; never scroll toward
                    // days 28–31 even when the calendar contains those days.
                    const day27X = coords.length ? coords[coords.length - 1].x : 0;
                    const rightEdgePadding = 4;
                    const endTarget = Math.max(
                        0,
                        Math.min(maxScroll, day27X - monthScroll.clientWidth + rightEdgePadding)
                    );
                    monthScroll.scrollLeft = Math.max(0, Math.min(maxScroll, endTarget * p));
                }

                if (p < 1) {
                    requestAnimationFrame(tick);
                    return;
                }

                finishPrevious();
            };

            requestAnimationFrame(tick);
        }

        function setupWeeklySwipe() {
            const card = document.getElementById('weekly-progress-card');
            if (!card) return;

            let startX = 0;
            let startY = 0;

            card.addEventListener('touchstart', (e) => {
                if (!e.touches || e.touches.length !== 1) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            card.addEventListener('touchend', (e) => {
                if (!e.changedTouches || e.changedTouches.length !== 1) return;

                // Month View must never use swipe gestures for month navigation.
                // Swipes beginning inside the monthly graph are reserved for its
                // native horizontal scrolling; Week View keeps its existing swipe.
                if (progressGraphMode === 'month' && hasOneFullCalendarMonthOfHistory()) return;

                const dx = e.changedTouches[0].clientX - startX;
                const dy = e.changedTouches[0].clientY - startY;
                const threshold = 50;

                if (Math.abs(dx) < threshold || Math.abs(dx) <= Math.abs(dy)) return;
                if (dx > 0) changeWeekOffset(-1);
                else changeWeekOffset(1);
            }, { passive: true });
        }

        function setProgressGraphMode(mode) {
            if (mode === 'month' && !hasOneFullCalendarMonthOfHistory()) return;

            progressGraphMode = mode === 'month' ? 'month' : 'week';

            // Switching between Week and Month always returns to the
            // currently present period (This Week / This Month).
            appState.weekOffset = 0;
            monthOffset = 0;
            lastWeekGraphOffset = 0;
            lastMonthGraphOffset = 0;

            renderDashboard(false, true);
        }

        function changeWeekOffset(delta) {
            if (progressGraphMode === 'month' && hasOneFullCalendarMonthOfHistory()) {
                const bounds = getMonthlyGraphBounds();
                // One step before the earliest historical month is the N/A state.
                // Do not allow navigation farther back than that state.
                monthOffset = Math.max(bounds.minOffset - 1, Math.min(bounds.maxOffset, monthOffset + delta));
                lastMonthGraphOffset = monthOffset;
                renderDashboard();
                return;
            }
            const bounds = getWeeklyGraphBounds();
            // One step before the earliest historical week is the N/A state.
            // Do not allow navigation farther back than that state.
            appState.weekOffset = Math.max(bounds.minOffset - 1, Math.min(bounds.maxOffset, appState.weekOffset + delta));
            lastWeekGraphOffset = appState.weekOffset;
            renderDashboard();
        }

        function showChapterImportanceName(chapterTarget) {
            const container = document.getElementById('building-chart-container');
            if (!container || !chapterTarget) return;

            const previous = container.querySelector('.chapter-importance-name-indicator');
            if (previous) previous.remove();

            const chapterName = chapterTarget.dataset.chapterName || '';
            if (!chapterName) return;

            const indicator = document.createElement('span');
            indicator.className = 'chapter-importance-name-indicator';
            indicator.textContent = chapterName;

            const visualHeight = Number(chapterTarget.dataset.visualHeight || 0);
            const heightPx = Number(chapterTarget.dataset.heightPx || 0);
            const labelSpace = 6 + 18;
            indicator.style.setProperty(
                '--chapter-indicator-bottom',
                `${Math.max(30, labelSpace + Math.max(0, visualHeight - heightPx) + 6)}px`
            );

            chapterTarget.appendChild(indicator);

            // Keep the indicator fully inside the visible graph area.
            // Center it over the selected chapter normally, but clamp it at either
            // edge when a long chapter name would otherwise overflow the screen.
            const targetRect = chapterTarget.getBoundingClientRect();
            const indicatorRect = indicator.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const edgePadding = 4;

            const targetCenter = targetRect.left + (targetRect.width / 2);
            const desiredLeft = targetCenter - (indicatorRect.width / 2);
            const minLeft = containerRect.left + edgePadding;
            const maxLeft = Math.max(minLeft, containerRect.right - edgePadding - indicatorRect.width);
            const clampedLeft = Math.min(Math.max(desiredLeft, minLeft), maxLeft);
            const shift = clampedLeft - desiredLeft;

            indicator.style.setProperty('--chapter-indicator-shift', `${shift}px`);
            // Move the arrow back by the same amount so it still points at the bar.
            indicator.style.setProperty('--chapter-indicator-arrow-shift', `${shift}px`);

            selectedChapterImportanceId = chapterTarget.dataset.chapterId || null;
        }

                    cqBtn.style.backgroundColor = '';

                }
            }

            // Check if CQ is disabled for Bangla 2nd or ICT
            if (currentBoardImpMode === 'CQ' && (sub.id === 'ban2' || sub.id === 'ict')) {
                container.innerHTML = `
                    <div class="w-full py-8 flex flex-col items-center justify-center text-center space-y-2">

                    </div>
                `;
                return;
            }

            const impKey = currentBoardImpMode === 'CQ' ? 'cqPastCount' : 'mcqPastCount';
            let chapters = [...sub.chapters];
            const sortImportance = (a,b) => { const av=a[impKey]||0, bv=b[impKey]||0; return bv!==av ? bv-av : a.origNum-b.origNum; };
            if (sub.id === 'ban1') {
                const firstPart = chapters.filter(ch => ch.origNum >= 1 && ch.origNum <= 15 && BANGLA1_PRIORITY_CHAPTERS.includes(ch.origNum)).sort(sortImportance);
                const secondPart = chapters.filter(ch => ch.origNum >= 16 && ch.origNum <= 30 && BANGLA1_PRIORITY_CHAPTERS.includes(ch.origNum)).sort(sortImportance);
                chapters = [...firstPart, ...secondPart];
            } else { chapters.sort(sortImportance); }

            let maxVal = 1;
            chapters.forEach(ch => {
                const val = ch[impKey] || 0;
                if (val > maxVal) maxVal = val;
            });

            let html = '';
            chapters.forEach((ch, index) => {
                const countVal = ch[impKey] || 0;

                                    ${countVal}
                                </span>
                                <div class="w-full max-w-[28px] rounded-t-lg shadow-sm transition-all duration-300 building-bar group-hover:brightness-110 group-hover:scale-y-105" 
                                     style="height: ${heightPx}px; background: linear-gradient(to top, ${themeColor}, ${themeColor}dd); box-shadow: 0 4px 10px ${themeColor}30;">
                                </div>
                            </div>
                        </div>
                        <span class="text-[10px] font-bold text-slate-600 group-hover:text-slate-900 transition-colors bg-white/80 px-1 rounded-md border border-slate-100">C${ch.origNum}</span>
                    </div>
                `;
            });

            container.innerHTML = html;
            container.scrollLeft = 0;

            if (selectedChapterImportanceId) {
                const selected = container.querySelector(`[data-chapter-id="${selectedChapterImportanceId}"]`);
                if (selected) showChapterImportanceName(selected);

        function initializePendingSettingsState() {
            pendingSettingsState = {
                dates: JSON.parse(JSON.stringify(appState.dates || {})),
                subjects: JSON.parse(JSON.stringify(appState.subjects || [])),
                theme: appState.theme === 'dark' ? 'dark' : 'light',

                }
            };
        }

        function getPendingSettingsState() {
            return pendingSettingsState || appState;
        }

        function commitPendingSettingsChanges() {
            if (!pendingSettingsState) return;
            appState.dates = JSON.parse(JSON.stringify(pendingSettingsState.dates || appState.dates || {}));
            appState.user = appState.user || {};
            appState.user.name = (pendingSettingsState.user && typeof pendingSettingsState.user.name === 'string') ? pendingSettingsState.user.name : appState.user.name || 'নাদিম হোসেন';
            appState.user.welcomeName = (pendingSettingsState.user && typeof pendingSettingsState.user.welcomeName === 'string') ? pendingSettingsState.user.welcomeName : appState.user.welcomeName || 'NADIM';
            // Apply theme only for the current session. saveStorage() intentionally
            // excludes theme, so refresh/reopen always returns to Light mode.
            appState.theme = pendingSettingsState.theme === 'dark' ? 'dark' : 'light';
            applyAppTheme(appState.theme);

            const pendingById = new Map((pendingSettingsState.subjects || []).map(s => [s.id, s]));
            (appState.subjects || []).forEach(sub => {
                const pendingSub = pendingById.get(sub.id);
                if (!pendingSub) return;
                (sub.chapters || []).forEach(ch => {
                    const pendingCh = (pendingSub.chapters || []).find(pc => pc.id === ch.id);
                    if (!pendingCh) return;
                    ['cqPastCount', 'mcqPastCount', 'cqTarget', 'mcqTarget', 'sqTarget'].forEach(key => {
                        if (Object.prototype.hasOwnProperty.call(pendingCh, key)) ch[key] = pendingCh[key];
                        else if (key in ch) delete ch[key];
                    });
                });
            });
            pendingSettingsState = null;
        }

            pendingSettingsState = null;

            if (currentSubjectModalType === 'importance') selectedSettingsSubId = subId;

            renderSettingsContent();

        function openSettingsModal() {
            showSettingsPasswordPopup('open');
        }

        function settingsDeepEqual(a, b) {
            try {
                return JSON.stringify(a) === JSON.stringify(b);
            } catch (e) {
                return false;
            }
        }

        function settingsHasPendingImageChanges() {
            if (pendingProfileImageBlob) return true;
            return Object.keys(pendingCoverImageBlobs || {}).length > 0;
        }

        function settingsHasChanges() {
            if (!settingsStateSnapshot || !pendingSettingsState) return false;
            return !settingsDeepEqual(
                {
                    dates: pendingSettingsState.dates || {},
                    subjects: pendingSettingsState.subjects || [],
                    theme: pendingSettingsState.theme === 'dark' ? 'dark' : 'light',
                    user: {
                        name: pendingSettingsState.user?.name || '',
                        welcomeName: pendingSettingsState.user?.welcomeName || ''
                    }
                },
                {
                    dates: settingsStateSnapshot.dates || {},
                    subjects: settingsStateSnapshot.subjects || [],
                    theme: settingsStateSnapshot.theme === 'dark' ? 'dark' : 'light',
                    user: {
                        name: settingsStateSnapshot.user?.name || '',
                        welcomeName: settingsStateSnapshot.user?.welcomeName || ''
                    }
                }
            ) || settingsHasPendingImageChanges();
        }

        function saveSettingsChangesOrShowPassword() {
            if (!settingsHasChanges()) {
                showNoChangesPopup();
                return;
            }
            showSettingsPasswordPopup('save');
        }

                        GO BACK !
                    </button>

            const modalContent = document.getElementById('modal-content');

                    if (e.target === overlay) {

        function showSettingsPasswordPopup(action = 'open') {
            const contentHtml = `
                <div id="settings-password-dialog" class="space-y-5">
                    <div class="text-center space-y-2">
                        <div class="mx-auto w-14 h-14 rounded-2xl bg-[#F8B337]/15 text-[#F8B337] flex items-center justify-center">
                            <i class="fa-solid fa-lock text-xl"></i>
                        </div>
                        <div id="settings-password-title-unit"><h3 id="settings-password-title" class="text-base font-extrabold text-slate-800">Enter Your Password....</h3></div>
                    </div>

                    <div class="space-y-2">
                        <div class="relative">
                            <input id="settings-password-input" type="password" autocomplete="off"
                                placeholder="Password"
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 pr-12 text-sm font-bold text-slate-800 outline-none focus:ring-2 focus:ring-[#F8B337]/40 password-field-dots"
                                oninput="clearSettingsPasswordEmptyInvalid(this);"
                                onfocus="clearSettingsPasswordEmptyInvalid(this);"
                                onkeydown="if(event.key==='Enter'){verifySettingsPassword('${action}');}">
                            <button id="settings-password-toggle" type="button" onclick="toggleSettingsPasswordVisibility()"

                                title="Show password"
                                class="absolute right-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center text-xs border border-slate-200/80 shadow-sm transition-all duration-200 hover:bg-slate-200 active:scale-95">
                                <i id="settings-password-eye-icon" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                        <p class="text-[9px] leading-snug text-slate-400 text-center">Tip -- ${appState.user.welcomeName || 'NADIM'}, Go Back To Study Soon....</p>
                    </div>

                    <div id="settings-password-error" class="hidden text-center space-y-3">
                        <button type="button" onclick="settingsPasswordGoBack()"

                            GO BACK !
                        </button>
                    </div>

                    <button id="settings-password-submit" type="button" onclick="verifySettingsPassword('${action}')"
                        class="w-full py-3.5 bg-[#F8B337] text-white font-bold text-sm rounded-xl shadow-md active:scale-95 transition-all">
                        CONTINUE
                    </button>
                </div>

            showModal(contentHtml);
            const passwordModalContent = document.getElementById('modal-content');
            if (passwordModalContent) {
                passwordModalContent.onclick = function(e) {
                    // Clicking the input already clears the error through its existing
                    // onfocus/oninput handlers. Preserve all button behavior as-is.
                    if (e.target.closest('#settings-password-input, #settings-password-submit, #settings-password-toggle, button')) return;
                    const passwordInput = document.getElementById('settings-password-input');
                    if (passwordInput) clearSettingsPasswordEmptyInvalid(passwordInput);
                };
            }
            setTimeout(() => document.getElementById('settings-password-input')?.focus(), 50);
        }

        function toggleSettingsPasswordVisibility() {
            const input = document.getElementById('settings-password-input');
            const button = document.getElementById('settings-password-toggle');
            const icon = document.getElementById('settings-password-eye-icon');
            if (!input || !button || !icon) return;

            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';

            if (isHidden) {
                icon.className = 'fa-regular fa-eye-slash';
                button.classList.add('settings-password-eye-active');
                button.setAttribute('aria-label', 'Hide password');
                button.setAttribute('title', 'Hide password');
            } else {
                icon.className = 'fa-regular fa-eye';
                button.classList.remove('settings-password-eye-active');
                button.setAttribute('aria-label', 'Show password');
                button.setAttribute('title', 'Show password');
            }
        }

        function clearSettingsPasswordEmptyInvalid(input) {
            if (!input) return;
            if (input._emptyInvalidTimer) {
                clearTimeout(input._emptyInvalidTimer);
                input._emptyInvalidTimer = null;
            }
            input.classList.remove('settings-password-empty-invalid');
        }

        async function verifySettingsPassword(action) {
            const input = document.getElementById('settings-password-input');
            if (!input) return;

            // Deliberately exact comparison: case, spaces, symbols and every character matter.
            const password = input.value;
            const correctPassword = 'TryToStayCalm!!';

            // Only a completely empty field is invalid; spaces/other characters remain
            // valid input and continue through the existing exact password comparison.
            if (password === '') {
                // Empty-password feedback: shake immediately and stay red indefinitely.
                // Touching/focusing the field or typing clears the red state.
                if (input._emptyInvalidTimer) {
                    clearTimeout(input._emptyInvalidTimer);
                    input._emptyInvalidTimer = null;
                }
                input.classList.remove('settings-password-empty-invalid');
                void input.offsetWidth;
                input.classList.add('settings-password-empty-invalid');
                input._emptyInvalidTimer = null;
                return;
            }

            if (action.startsWith('deleteImage:')) {
                if (password === correctPassword) {
                    verifyImageDeletePassword(action);
                } else {
                    verifyImageDeletePassword(action);
                }
                return;
            }

            if (password === correctPassword) {
                if (action === 'open') {
                    discardPendingImages();
                    settingsStateSnapshot = JSON.parse(JSON.stringify(appState));
                    initializePendingSettingsState();
                    settingsSessionActive = true;
                    // The gear animation is consumed only by this successful Settings entry render.
                    settingsGearAnimationPending = true;
                    if (!selectedSettingsSubId && appState.subjects.length > 0) selectedSettingsSubId = appState.subjects[0].id;
                    if (!selectedTargetSubId && appState.subjects.length > 0) selectedTargetSubId = appState.subjects[0].id;
                    activeSettingsMainTab = 'general';
                    activeGeneralTab = 'profile';
                    renderSettingsContent();
                } else if (action === 'save') {
                    try {
                        // Restore the original session snapshot first so unrelated
                        // Settings behavior remains exactly as before, then commit
                        // only the three scoped pending sections.
                        if (settingsStateSnapshot) {
                            appState = JSON.parse(JSON.stringify(settingsStateSnapshot));
                        }
                        commitPendingSettingsChanges();
                        await commitPendingImages();
                        settingsStateSnapshot = null;
                        settingsSessionActive = false;
                        saveStorage();
                        closeModal();
                        appState.activeTab = 'home';
                        switchTab('home');
                    } catch (e) {
                        console.error('Settings image save failed:', e);
                        alert('Image Save করা যায়নি। আবার চেষ্টা করুন।');
                    }
                } else {
                    settingsStateSnapshot = null;
                    settingsSessionActive = false;
                    discardPendingImages();
                    closeModal();
                    if (appState.activeTab === 'home') renderHome();
                    else renderDashboard();
                }
                return;
            }

            // Wrong password: discard only the temporary scoped Settings changes.
            // appState was never modified by Exam Dates / Priority / Target, so no
            // partial persistent write can occur.
            if (action === 'save') {
                discardPendingSettingsChanges();
                if (settingsStateSnapshot) {
                    appState = JSON.parse(JSON.stringify(settingsStateSnapshot));
                    saveStorage();
                    discardPendingImages();
                }
            }

            const dialog = document.getElementById('settings-password-dialog');
            if (dialog) {
                const inputWrap = input.parentElement;
                if (inputWrap) inputWrap.classList.add('hidden');

                const submit = document.getElementById('settings-password-submit');
                if (submit) submit.classList.add('hidden');

                const title = document.getElementById('settings-password-title');
                if (title) {
                    title.textContent = 'Oops !… Access Denied !';
                    title.classList.remove('text-base', 'settings-access-denied-title');
                    title.classList.add('text-lg', 'text-red-500');
                    const titleUnit = document.getElementById('settings-password-title-unit');
                    if (titleUnit) titleUnit.classList.add('no-changes-title-unit', 'settings-access-denied-title');
                }

                const error = document.getElementById('settings-password-error');
                if (error) error.classList.remove('hidden');
            }
        }

        function settingsPasswordGoBack() {
            settingsStateSnapshot = null;
            settingsSessionActive = false;
            discardPendingSettingsChanges();
            discardPendingImages();
            closeModal();
            appState.activeTab = 'home';
            switchTab('home');
        }

            // Revert the live theme preview to the last successfully saved theme.
            if (settingsStateSnapshot) {
                appState.theme = settingsStateSnapshot.theme === 'dark' ? 'dark' : 'light';
                applyAppTheme(appState.theme);
            } else {
                applyAppTheme(appState.theme || 'light');
            }
            settingsStateSnapshot = null;
            settingsSessionActive = false;
            discardPendingSettingsChanges();
            discardPendingImages();
            closeModal();
            if (appState.activeTab === 'home') renderHome();
            else renderDashboard();
        }

        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(blob);
            });
        }

        function dataUrlToBlob(dataUrl) {
            const parts = String(dataUrl).split(',');
            if (parts.length < 2) throw new Error('Invalid image data');
            const header = parts[0];
            const raw = atob(parts.slice(1).join(','));
            const mimeMatch = header.match(/data:([^;]+);base64/i);
            const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
            const bytes = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
            return new Blob([bytes], { type: mime });
        }

        async function getAllStoredImagesForBackup() {
            const db = await openImageDB();
            const requiredKeys = ['profile', ...DEFAULT_SUBJECTS.map(sub => 'cover:' + sub.id)];

            return new Promise((resolve, reject) => {
                const tx = db.transaction(IMAGE_STORE, 'readonly');
                const store = tx.objectStore(IMAGE_STORE);

                Promise.all(requiredKeys.map(key => new Promise((res, rej) => {
                    const request = store.get(key);
                    request.onsuccess = () => res({ key, value: request.result || null });
                    request.onerror = () => rej(request.error);
                }))).then(async entries => {
                    const images = {};
                    for (const { key, value } of entries) {
                        // Keep the established Data URL storage method for the
                        // permanent profile/book-cover images only.
                        if (value instanceof Blob) {
                            images[key] = await blobToDataUrl(value);
                        }
                    }
                    resolve(images);
                }).catch(reject);
            });
        }

        function highlightJson(jsonText) {
            const escaped = jsonText
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            return escaped.replace(/("(?:\\.|[^"\\])*"(?=\s*:)|"(?:\\.|[^"\\])*")|(\b(?:true|false|null)\b)|(-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)|([{}\[\],:])/g,
                (match, stringToken, booleanValue, numberValue, punctuation) => {
                    if (stringToken) {
                        const isKey = /"\s*:$/.test(match);
                        return `<span class="${isKey ? 'json-key' : 'json-string'}">${match}</span>`;
                    }
                    if (booleanValue) return `<span class="json-boolean">${booleanValue}</span>`;
                    if (numberValue) return `<span class="json-number">${numberValue}</span>`;
                    if (punctuation) return `<span class="json-punctuation">${punctuation}</span>`;
                    return match;
                });
        }

        function sanitizeRevisionEntries(snapshot) {
            (snapshot.subjects || []).forEach(sub => (sub.chapters || []).forEach(ch => {
                if (!Array.isArray(ch.revisionHistory)) ch.revisionHistory = [];
                ch.revisionHistory = ch.revisionHistory.map((rev, idx) => {
                    const r = (rev && typeof rev === 'object') ? rev : {};
                    delete r.target;
                    delete r.progress;
                    delete r.revisionProgress;
                    delete r.percentage;
                    r.number = idx + 1;
                    if (!r.actual || typeof r.actual !== 'object') r.actual = {study:{book:0,class:0,notes:0,summary:0},cq:0,mcq:0,sq:0,note:r.note||''};
                    delete r.actual.pictures;
                    delete r.actual.audios;
                    return r;
                });
                ch.revisionCount = ch.revisionHistory.length;
            }));
        }

        function sanitizeRevisionMediaForBackup(snapshot) {
            (snapshot.subjects || []).forEach(sub => {
                (sub.chapters || []).forEach(ch => {
                    getRevisionHistory(ch).forEach(rev => {
                        ['pictures', 'audios'].forEach(kind => {
                            if (!Array.isArray(rev[kind])) return;
                            rev[kind] = rev[kind].map((x, i) => ({
                                name: x && x.name || `${kind === 'pictures' ? 'PIC' : 'Audio'} - #${i + 1}`,
                                identifier: x && x.identifier || `${kind === 'pictures' ? 'PIC' : 'Audio'} - #${i + 1}`,
                                storageKey: x && (x.storageKey || x.id) || null,
                                type: x && x.type || (kind === 'pictures' ? 'image/*' : 'audio/*')
                            }));
                        });
                        if (rev.actual && typeof rev.actual === 'object') {
                            delete rev.actual.pictures;
                            delete rev.actual.audios;
                        }
                    });
                });
            });
        }
