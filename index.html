            return 0;
        }


        // --- OVERVIEW YOURSELF (isolated feature) ---
        function overviewYourSelfFormatDate(value) {
            if (!value) return 'Not Studied Yet';
            const d = new Date(value);
            if (!Number.isFinite(d.getTime())) return String(value);
            return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
        }

        function overviewYourSelfChapterProgressText(value) {
            const n = Number(value) || 0;
            return Number.isInteger(n) ? `${n}%` : `${n.toFixed(1)}%`;
        }

        function overviewYourSelfGetProgressUpdateTimestamp(ch) {
            if (!ch) return 0;
            const candidates = [
                ch.progressUpdatedAt,
                ch.progressUpdateTimestamp,
                ch.lastProgressUpdate
            ];
            for (const value of candidates) {
                if (typeof value === 'number' && Number.isFinite(value) && value > 0) return value;
                if (typeof value === 'string') {
                    const parsed = Date.parse(value);
                    if (Number.isFinite(parsed) && parsed > 0) return parsed;
                }
            }
            // Legacy data only has a date. Keep it as a deterministic fallback,
            // but every new progress save records an exact millisecond timestamp.
            if (ch.lastStudied) {
                const legacy = Date.parse(ch.lastStudied);
                if (Number.isFinite(legacy)) return legacy;
            }
            return 0;
        }

        function overviewYourSelfFormatRevisionDate(value) {
            const time = Number(value) > 0 ? Number(value) : Date.parse(value || '');
            if (!Number.isFinite(time) || time <= 0) return 'Date unavailable';
            const d = new Date(time);
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sept','Oct','Nov','Dec'];
            return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        function overviewYourSelfGetRevisionDate(revision) {
            if (!revision || typeof revision !== 'object') return 0;
            return getRevisionTimestamp(revision);
        }

        function overviewYourSelfGetStudyDateKey(ch) {
            if (!ch) return '';
            // New progress saves keep an exact timestamp plus the local study date.
            // Prefer the explicit local date so every chapter studied on the same
            // calendar day is grouped together, rather than requiring identical
            // millisecond timestamps.
            if (typeof ch.lastStudied === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(ch.lastStudied)) {
                return ch.lastStudied;
            }
            const time = overviewYourSelfGetProgressUpdateTimestamp(ch);
            return time > 0 ? getLocalDateKey(new Date(time)) : '';
        }

        function overviewYourSelfFormatStudyDateKey(value) {
            if (!value) return 'Not Studied Yet';
            const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (match) {
                const d = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
                return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
            }
            return overviewYourSelfFormatDate(value);
        }

        function overviewYourSelfGetMetrics(sub) {
            const chapters = Array.isArray(sub.chapters) ? sub.chapters : [];
            const studied = chapters
                .map(ch => ({ ch, time: overviewYourSelfGetProgressUpdateTimestamp(ch), dateKey: overviewYourSelfGetStudyDateKey(ch) }))
                .filter(x => x.dateKey)
                .sort((a,b) => b.time - a.time);
            const latestDateKey = studied.length ? studied.reduce((latest, x) => x.dateKey > latest ? x.dateKey : latest, '') : '';
            const latestTime = studied.length ? studied[0].time : 0;
            const latestChapters = latestDateKey ? studied.filter(x => x.dateKey === latestDateKey).map(x => x.ch) : [];

            let mcqTarget=0, mcqSolved=0, mcqRemaining=0;
            let sqTarget=0, sqSolved=0, sqRemaining=0;
            let cqTarget=0, cqSolved=0, cqRemaining=0;
            chapters.forEach(ch => {
                const mt = Math.max(0, Number(ch.mcqTarget) || 0);
                const ms = Math.max(0, Number(ch.mcqSolved) || 0);
                const st = Math.max(0, Number(ch.sqTarget) || 0);
                const ss = Math.max(0, Number(ch.sqSolved) || 0);
                const ct = Math.max(0, Number(ch.cqTarget) || 0);
                const cs = Math.max(0, Number(ch.cqSolved) || 0);
                mcqTarget += mt; mcqSolved += ms; mcqRemaining += Math.max(0, mt-ms);
                sqTarget += st; sqSolved += ss; sqRemaining += Math.max(0, st-ss);
                cqTarget += ct; cqSolved += cs; cqRemaining += Math.max(0, ct-cs);
            });

            const hasMCQ = mcqTarget > 0 || mcqSolved > 0;
            const hasSQ = sqTarget > 0 || sqSolved > 0;
            const hasCQ = cqTarget > 0 || cqSolved > 0;
            const revisionChapters = chapters
                .filter(ch => getRevisionProgress(ch) > 0)
                .map(ch => ({ ch, revisionCount: getRevisionProgress(ch), latestRevisionTime: getLatestRevisionTimestamp(ch) }))
                .sort((a,b) => {
                    const diff = b.latestRevisionTime - a.latestRevisionTime;
                    if (diff !== 0) return diff;
                    return (Number(a.ch.origNum) || 0) - (Number(b.ch.origNum) || 0);
                });

            const withProgress = chapters.map(ch => ({ ch, pct: Math.min(100, Math.max(0, Number(getChapterProgress(ch, sub.id)) || 0)) }));
            const highest = withProgress.length ? Math.max(...withProgress.map(x => x.pct)) : 0;
            const lowest = withProgress.length ? Math.min(...withProgress.map(x => x.pct)) : 0;
            const eps = 0.0001;
            return {
                chapters, mcqTarget, mcqSolved, mcqRemaining, sqTarget, sqSolved, sqRemaining,
                cqTarget, cqSolved, cqRemaining, hasMCQ, hasSQ, hasCQ, revisionChapters,
                latestDate: latestDateKey ? overviewYourSelfFormatStudyDateKey(latestDateKey) : 'Not Studied Yet',
                latestChapters, highest, highestChapters: withProgress.filter(x => Math.abs(x.pct-highest)<eps),
                lowest, lowestChapters: withProgress.filter(x => Math.abs(x.pct-lowest)<eps)
            };
        }

        function renderOverviewYourSelf(selectedId, preserveScrollLeft=null) {
            const subjects = getRevisionCornerSubjects();
            if (!subjects.length) return;
            const safeSelectedId = subjects.some(s => s.id === selectedId) ? selectedId : null;
            const selected = safeSelectedId ? subjects.find(s => s.id === safeSelectedId) : null;
            let detail = '';
            if (selected) {
                const m = overviewYourSelfGetMetrics(selected);
                const latestChapterNames = m.latestChapters.length ? m.latestChapters.map(ch => ch.name).join(' · ') : 'Not Studied Yet';
                detail = `
                    <div class="rounded-2xl p-4 border border-slate-200/80 shadow-sm" style="background:${selected.bgLight || '#f8fafc'};">
                        <div class="flex items-center gap-3">
                            <img src="${getStoredCoverImageSrc(selected.id)}" alt="${selected.name} cover" onerror="this.onerror=null;this.src=BUILTIN_BOOK_PLACEHOLDER;" class="w-14 h-20 rounded-xl object-cover border border-white shadow-sm flex-shrink-0">
                            <div class="min-w-0 flex-1">

            showModal(`

            if (preserveScrollLeft !== null) requestAnimationFrame(() => { const scroller=document.querySelector('.overview-yourself-covers'); if(scroller) scroller.scrollLeft=preserveScrollLeft; });
            if (selected) animateOverviewYourSelfProgress(getSubjectProgress(selected));

        function animateOverviewYourSelfProgress(targetProgress) {
            if (Number(targetProgress) < 12) return;
            const progressBar = document.getElementById('overview-yourself-progress-fill');
            const track = document.getElementById('overview-yourself-progress-track');
            if (!progressBar || !track) return;
            progressBar.style.width = '0%';
            progressBar.style.transition = 'none';
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    const bar = document.getElementById('overview-yourself-progress-fill');
                    const currentTrack = document.getElementById('overview-yourself-progress-track');
                    if (!bar || !currentTrack) return;
                    const target = Math.min(100, Math.max(0, Number(targetProgress) || 0));
                    const step = target / 3;
                    bar.style.transition = 'width 180ms cubic-bezier(.22,1,.36,1)';
                    const go = (n) => {
                        const current = document.getElementById('overview-yourself-progress-fill');
                        const t = document.getElementById('overview-yourself-progress-track');
                        if (!current || !t) return;
                        const segmentStart = (n - 1) * step;
                        const segmentWidth = step;
                        current.style.width = `${Math.min(target, segmentWidth * n)}%`;
                        const impact = document.createElement('span');
                        impact.className = 'chapter-progress-step-impact';
                        impact.style.left = `${segmentStart}%`;
                        impact.style.width = `${segmentWidth}%`;
                        t.appendChild(impact);
                        setTimeout(() => impact.remove(), 245);
                    };
                    go(1);
                    setTimeout(() => go(2), 220);
                    setTimeout(() => go(3), 440);
                });
            });
        }

        function openOverviewYourSelf() {
            renderOverviewYourSelf(null);
        }

        function selectOverviewYourSelfSubject(subId) {
            const scroller=document.querySelector('.overview-yourself-covers');

        function openNotificationModal() {
            if (typeof stopAllInboxNoteAudio === 'function') stopAllInboxNoteAudio();
            let pendingChaps = [];
            let unstudiedChaps = [];
            let longAgoChaps = [];
            let finishedChaps = [];
            let reExaminedChaps = [];
            const today = new Date();

            appState.subjects.forEach(sub => {
                sub.chapters.forEach(ch => {
                    const pct = getChapterProgress(ch, sub.id);
                    if (pct === 0) {
                        unstudiedChaps.push({ sub, ch, pct });
                    } else if (pct < 100) {
                        pendingChaps.push({ sub, ch, pct });
                    } else if (pct === 100) {
                        finishedChaps.push({ sub, ch, pct, completionTimestamp: getChapterCompletionTimestamp(ch) });
                    }

                    const revisionCount = Number(ch.revisionCount) || 0;
                    if (revisionCount > 0) {
                        reExaminedChaps.push({ sub, ch, pct, revisionCount });
                    }

                    if (ch.lastStudied) {
                        const past = new Date(ch.lastStudied);
                        const diffDays = Math.floor((today - past) / (1000 * 60 * 60 * 24));

                            longAgoChaps.push({ sub, ch, diffDays });

                    }
                });
            });

            let contentHtml = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-glass-17 text-base font-extrabold text-slate-800"><span class="notification-pendulum-icon mr-2"><i class="fa-solid fa-bell text-sky-600"></i></span>Notifications & Alerts</h3>

                            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </div>

                    <div id="notification-scroll-area" class="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
            `;

            if (unstudiedChaps.length > 0) {
                contentHtml += `
                    <div>
                        <h5 class="notification-segment-pill notification-pill-zero text-xs font-bold text-rose-600 uppercase tracking-wider">0% Touch Chapters (${unstudiedChaps.length})</h5>
                        <div class="space-y-2">
                            ${unstudiedChaps.map(item => `
                                <div onclick="openChapterDetailModal('${item.sub.id}', '${item.ch.id}')" class="notification-initial-chapter p-3 bg-rose-50 border border-rose-100 rounded-xl flex justify-between items-center cursor-pointer hover:bg-rose-100/60">
                                    <div>
                                        <h6 class="font-bold text-xs notification-chapter-name notification-chapter-zero">${item.ch.name}</h6>
                                        <span class="text-[10px] text-slate-500">${item.sub.name}</span>
                                    </div>
                                    <span class="text-xs font-bold text-rose-600">0%</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            if (longAgoChaps.length > 0) {
                contentHtml += `
                    <div>
                        <h5 class="text-xs font-bold text-amber-600 uppercase tracking-wider mb-2">Not Studied Recently (${longAgoChaps.length})</h5>
                        <div class="space-y-2">
                            ${longAgoChaps.map(item => `
                                <div onclick="openChapterDetailModal('${item.sub.id}', '${item.ch.id}')" class="notification-initial-chapter p-3 bg-amber-50 border border-amber-100 rounded-xl flex justify-between items-center cursor-pointer hover:bg-amber-100/60">
                                    <div>
                                        <h6 class="font-bold text-xs notification-chapter-name notification-chapter-attention">${item.ch.name}</h6>
                                        <span class="text-[10px] text-slate-500">${item.sub.name}</span>
                                    </div>
                                    <span class="text-xs font-bold text-amber-700">${item.diffDays} Days Ago</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Attention Needed: lowest chapter progress first.
            pendingChaps.sort((a, b) => {
                const diff = a.pct - b.pct;
                if (diff !== 0) return diff;
                return (Number(a.ch.origNum) || 0) - (Number(b.ch.origNum) || 0);
            });

            // FINISHED: oldest completion first, newest completion last.
            // completionTimestamp is recorded at the moment a chapter reaches 100%.
            // For legacy chapters without a recorded timestamp, use a deterministic
            // chapter-order fallback rather than random ordering.
            finishedChaps.sort((a, b) => {
                const at = Number(a.completionTimestamp) || 0;
                const bt = Number(b.completionTimestamp) || 0;
                if (at !== bt) {
                    if (at === 0) return 1;
                    if (bt === 0) return -1;
                    return at - bt;
                }
                const subDiff = String(a.sub.id).localeCompare(String(b.sub.id));
                if (subDiff !== 0) return subDiff;
                return (Number(a.ch.origNum) || 0) - (Number(b.ch.origNum) || 0);
            });

            if (pendingChaps.length > 0) {
                contentHtml += `
                    <div>
                        <h5 class="notification-segment-pill notification-pill-attention text-xs font-bold text-sky-600 uppercase tracking-wider">Attention Needed (${pendingChaps.length})</h5>
                        <div class="space-y-2">
                            ${pendingChaps.map(item => `
                                <div onclick="openChapterDetailModal('${item.sub.id}', '${item.ch.id}')" class="notification-initial-chapter p-3 bg-sky-50 border border-sky-100 rounded-xl flex justify-between items-center cursor-pointer hover:bg-sky-100/60">
                                    <div>
                                        <h6 class="font-bold text-xs notification-chapter-name notification-chapter-attention">${item.ch.name}</h6>

            }

            if (finishedChaps.length > 0) {
                contentHtml += `
                    <div>
                        <h5 class="notification-segment-pill notification-pill-finished text-xs font-bold text-emerald-600 uppercase tracking-wider">FINISHED (${finishedChaps.length})</h5>
                        <div class="space-y-2">
                            ${finishedChaps.map(item => `
                                <div onclick="openChapterDetailModal('${item.sub.id}', '${item.ch.id}')" class="notification-initial-chapter p-3 bg-[#F0FFF1] border border-emerald-100 rounded-xl flex justify-between items-center cursor-pointer hover:bg-emerald-50/70">
                                    <div class="min-w-0 flex items-center gap-2">
                                        <div class="min-w-0"><h6 class="font-bold text-xs notification-chapter-name notification-chapter-finished leading-snug">${item.ch.name}<span class="chapter-complete-badge" aria-label="Completed"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Completion Badge"><defs><linearGradient id="dynamicCheck" x1="4" y1="18" x2="20" y2="6" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#16a34a"/><stop offset=".55" stop-color="#22c55e"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs><path d="M4.5 12.8 L9.4 17.3 L19.5 6.8" fill="none" stroke="url(#dynamicCheck)" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span></h6><span class="text-[10px] text-slate-500">${item.sub.name}</span></div>
                                    </div>
                                    <span class="text-xs font-bold text-emerald-700 flex-shrink-0">100%</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // RE - EXAMINED: newest actual revision first.
            reExaminedChaps.sort((a, b) => {
                const diff = getLatestRevisionTimestamp(b.ch) - getLatestRevisionTimestamp(a.ch);
                return diff !== 0 ? diff : (Number(b.ch.revisionCount) || 0) - (Number(a.ch.revisionCount) || 0);
            });

            if (reExaminedChaps.length > 0) {
                contentHtml += `
                    <div id="re-examined-segment">
                        <h5 class="notification-segment-pill notification-pill-reexamined text-xs font-bold uppercase tracking-wider" style="color:#FFCC00;border-color:#FFCC00;">RE - EXAMINED (${reExaminedChaps.length})</h5>
                        <div class="space-y-2">
                            ${reExaminedChaps.map(item => `
                                <div onclick="openRevisionChapterDetails('${item.sub.id}', '${item.ch.id}')" class="notification-initial-chapter re-examined-notification-card p-3 bg-[#fffef0] border-0 rounded-xl flex justify-between items-center cursor-pointer hover:bg-[#fff9d9]">
                                    <div class="min-w-0">
                                        <div class="re-examined-revision-dots" aria-label="${item.revisionCount} revision${item.revisionCount === 1 ? '' : 's'}">
                                            ${Array.from({ length: item.revisionCount }, () => '<span class="re-examined-revision-dot"></span>').join('')}
                                        </div>
                                        <h6 class="font-bold text-xs notification-chapter-name leading-snug">${item.ch.name}</h6>
                                        <span class="text-[10px] text-slate-500">${item.sub.name}</span>
                                    </div>
                                    <span class="text-xs font-bold text-emerald-700 flex-shrink-0">${Math.round(item.pct)}%</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Revision Corner is always available, even when RE - EXAMINED is hidden.
            contentHtml += `
                <div id="revision-corner-anchor" class="pt-1 flex justify-center items-center gap-2">
                    <button onclick="window.openOverviewYourSelf()" class="overview-yourself-launch-btn w-10 h-10 rounded-full flex items-center justify-center shadow-sm hover:brightness-105 active:scale-95 transition-all" style="background:#A2BFFE;color:#4b6b2a;" title="OverView YourSelf" aria-label="Open OverView YourSelf">

                    </button>
                    <button onclick="openRevisionCornerView()" class="revision-corner-button px-5 py-2.5 rounded-full font-extrabold text-sm text-slate-800 shadow-sm hover:brightness-105 active:scale-95 transition-all" style="background-color:#FFDBBB;">Revision Corner 🚀</button>
                    <button onclick="window.openInboxCenter()" class="inbox-center-launch-btn w-10 h-10 rounded-full flex items-center justify-center shadow-sm hover:brightness-105 active:scale-95 transition-all" style="background:#ABEDCA;color:#245d46;" title="Inbox Center" aria-label="Open Inbox Center">
                        <span class="inbox-emoji-icon" aria-hidden="true">💬</span>
                    </button>
                </div>
            `;

            const totalGrowth = appState.subjects.reduce((totals, sub) => {
                sub.chapters.forEach(ch => {
                    totals.cq += Number(ch.cqSolved) || 0;
                    totals.mcq += Number(ch.mcqSolved) || 0;
                    totals.sq += Number(ch.sqSolved) || 0;
                });
                return totals;
            }, { cq: 0, mcq: 0, sq: 0 });

            contentHtml += `
                    <div class="overall-growth-panel rounded-3xl p-5 space-y-4">
                        <div class="flex items-center justify-between"><div><h4 class="text-glass-17 text-base font-extrabold text-slate-800 overall-growth-title">Overall Growth</h4></div><i class="fa-solid fa-arrow-trend-up text-lg text-teal-600 opacity-70"></i></div>
                        <div class="grid grid-cols-3 gap-2">
                            ${[['CQ',totalGrowth.cq],['MCQ',totalGrowth.mcq],['SQ',totalGrowth.sq]].map(([label,value]) => `
                                <div class="rounded-2xl bg-white/60 backdrop-blur-md border border-white/80 p-3 text-center shadow-sm"><div class="text-xl font-extrabold text-teal-600 leading-none">${value}</div><div class="mt-1 text-sm font-bold text-slate-700"><span class="relative inline-flex items-center justify-center px-2 py-0.5 rounded-lg leading-none"><span class="absolute inset-0 rounded-lg bg-[#B7FFFA] -z-10"></span>${label}</span></div><div class="text-[9px] font-semibold tracking-widest uppercase text-slate-400">net</div></div>
                            `).join('')}
                        </div>
                        <div class="pt-2 border-t border-white/70 flex items-center gap-2.5"><img src="${getStoredProfileImageSrc()}" alt="Profile" class="w-8 h-8 rounded-full object-cover border-2 border-white shadow-sm ring-1 ring-teal-100" decoding="async" onerror="this.onerror=null;this.src=BUILTIN_AVATAR_PLACEHOLDER;"><p class="text-[10px] sm:text-[11px] leading-relaxed font-semibold text-teal-700 overall-growth-text">${getOverallGrowthMotivationalSentence()}</p></div>
                    </div>
                    </div>
                </div>
            `;
            notificationReturnScrollTop = null;
            window.__notificationReturnScrollTop = null;
            showModal(contentHtml);

            // used, so scrolling never re-triggers the animation.
            requestAnimationFrame(() => {

                const scrollArea = modalContent ? modalContent.querySelector('#notification-scroll-area') : null;
                const cards = scrollArea ? Array.from(scrollArea.querySelectorAll('.notification-initial-chapter')) : [];
                if (scrollArea) {
                    const areaRect = scrollArea.getBoundingClientRect();
                    cards.filter(card => {
                        const r = card.getBoundingClientRect();
                        return r.bottom > areaRect.top && r.top < areaRect.bottom;
                    }).forEach((card, index) => {
                        card.style.animationDelay = `${index * 45}ms`;
                        card.classList.add('notification-entry-animate');
                    });
                }
                const bell = modalContent ? modalContent.querySelector('.notification-pendulum-icon') : null;
                if (bell) {
                    bell.classList.remove('notification-pendulum-run');
                    void bell.offsetWidth;
                    bell.classList.add('notification-pendulum-run');
                }
            });
        }

        function animateNotificationRocket(button) {
            if (!button) return;
            const rocket = button.querySelector('.notification-rocket-icon');
            if (!rocket) return;
            rocket.classList.remove('notification-rocket-launch');
            void rocket.offsetWidth;
            rocket.classList.add('notification-rocket-launch');
            rocket.addEventListener('animationend', () => {
                rocket.classList.remove('notification-rocket-launch');
            }, { once: true });
        }

        function jumpToRevisionCornerFromNotifications() {
            const modalContent = document.getElementById('modal-content');
            const scrollArea = modalContent ? modalContent.querySelector('#notification-scroll-area') : null;
            const anchor = modalContent ? modalContent.querySelector('#revision-corner-anchor') : null;
            if (!scrollArea || !anchor) return;
            scrollArea.scrollTo({
                top: Math.max(0, anchor.offsetTop - Math.max(12, (scrollArea.clientHeight - anchor.offsetHeight) / 2)),
                behavior: 'smooth'
            });
        }

        // --- REVISION CORNER (PART 01) ---
        let revisionCornerView = 'subjects';
        let revisionCornerSubjectId = null;
        let revisionCornerSort = 'chapter-order';

        // Revision Corner intentionally works from the same subject array/order used by Home.
        // The two legacy/non-book subjects are not present in this app state, so all existing
        // subjects are shown here in their existing Home serial order.
        function getRevisionCornerSubjects() {
            return [...(appState.subjects || [])];
        }

        function hasCQData(ch) {
            return Number(ch && ch.cqTarget) > 0 || Number(ch && ch.cqSolved) > 0;
        }

        function hasMCQData(ch) {
            return Number(ch && ch.mcqTarget) > 0 || Number(ch && ch.mcqSolved) > 0;
        }

        function getRevisionHistory(ch) {
            if (!ch) return [];
            if (!Array.isArray(ch.revisionHistory)) ch.revisionHistory = [];
            return ch.revisionHistory;
        }

        function getRevisionProgress(ch) {
            const history = getRevisionHistory(ch);
            return history.length > 0 ? history.length : Math.max(0, Math.floor(Number(ch && ch.revisionCount) || 0));
        }

        // Returns the real timestamp of the latest revision entry. Revision sorting
        // must use when the revision was actually saved, not chapter number/count.
        function getRevisionTimestamp(revision) {
            if (!revision || typeof revision !== 'object') return 0;
            const candidates = [
                revision.createdAt,
                revision.timestamp,
                revision.revisedAt,
                revision.date,
                revision.metadata && revision.metadata.savedAt
            ];
            for (const value of candidates) {
                if (typeof value === 'number' && Number.isFinite(value)) return value;
                if (typeof value === 'string') {
                    const parsed = Date.parse(value);
                    if (Number.isFinite(parsed)) return parsed;
                }
            }
            return 0;
        }

        function getLatestRevisionTimestamp(ch) {
            const history = getRevisionHistory(ch);
            if (!history.length) return 0;
            return Math.max(...history.map(getRevisionTimestamp));
        }

        function getRevisionEntryProgress(revision) {
            if (!revision || typeof revision !== 'object') return 0;
            const value = Number(revision.progress ?? revision.revisionProgress ?? revision.percentage ?? 0);
            return Number.isFinite(value) ? Math.max(0, Math.min(100, value)) : 0;
        }

        function getRevisionCornerSortLabel(sortType) {
            const labels = {
                'chapter-order': 'Chapter Order',
                'highest-progress': 'Highest Progress',
                'lowest-progress': 'Lowest Progress',
                'cq-importance': 'CQ Importance',
                'mcq-importance': 'MCQ Importance',
                'highest-revision': 'Revision ↑',
                'lowest-revision': 'Revision ↓'
            };
            return labels[sortType] || 'Chapter Order';
        }

        function sortRevisionCornerChapters(chapters, sub, sortType, globalMode = false) {
            const list = [...chapters];

            // In the Subjects → Go view, Chapter Order is always the real serial/original
            // chapter order. The global Chapters view keeps its existing random "spot"
            // behavior under the renamed Spot Chapter option.
            if (sortType === 'chapter-order') {
                if (globalMode) {
                    for (let i = list.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [list[i], list[j]] = [list[j], list[i]];
                    }
                    return list;
                }
                return list.sort((a, b) => (Number(a.origNum) || 0) - (Number(b.origNum) || 0));
            }

            if (sortType === 'highest-progress') {
                return list.sort((a, b) => getChapterProgress(b, sub.id) - getChapterProgress(a, sub.id));
            }

            if (sortType === 'lowest-progress') {
                return list.sort((a, b) => getChapterProgress(a, sub.id) - getChapterProgress(b, sub.id));
            }

            if (sortType === 'cq-importance') {
                return list.sort((a, b) => {
                    const ac = hasCQData(a), bc = hasCQData(b);
                    if (globalMode && ac !== bc) return ac ? -1 : 1;
                    if (ac !== bc) return ac ? -1 : 1;
                    return (Number(b.cqPastCount) || 0) - (Number(a.cqPastCount) || 0);
                });
            }

            if (sortType === 'mcq-importance') {
                return list.sort((a, b) => {
                    const ac = hasMCQData(a), bc = hasMCQData(b);
                    if (globalMode && ac !== bc) return ac ? -1 : 1;
                    return (Number(b.mcqPastCount) || 0) - (Number(a.mcqPastCount) || 0);
                });
            }

            if (sortType === 'highest-revision' || sortType === 'lowest-revision') {
                // Revision sorting has two completely separate groups:
                // 1) revision > 0: sort by revision count
                // 2) revision = 0: sort by chapter progress
                // Zero-revision chapters can never be interleaved with revised chapters.
                const revisionDescending = sortType === 'highest-revision';
                const progressDescending = sortType === 'highest-revision';

                return list.sort((a, b) => {
                    const ar = getRevisionProgress(a);
                    const br = getRevisionProgress(b);
                    const aZero = ar === 0;
                    const bZero = br === 0;

                    // All non-zero revision chapters must come before all zero-revision chapters.
                    if (aZero !== bZero) return aZero ? 1 : -1;

                    // Non-zero revision group: Revision ↑ = high → low,
                    // Revision ↓ = low → high.
                    if (!aZero) {
                        const diff = revisionDescending ? (br - ar) : (ar - br);
                        if (diff !== 0) return diff;
                    }

                    // Zero-revision group: Revision ↑ = progress high → low,
                    // Revision ↓ = progress low → high.
                    if (aZero) {
                        const ap = getChapterProgress(a, sub.id);
                        const bp = getChapterProgress(b, sub.id);
                        const diff = progressDescending ? (bp - ap) : (ap - bp);
                        if (diff !== 0) return diff;
                    }

                    // Deterministic tie-breaker; never random.
                    return (Number(a.origNum) || 0) - (Number(b.origNum) || 0);
                });
            }

            return list;
        }

        // Keep the horizontal Sort By strip visually clean while still allowing touch scrolling.
        if (!document.getElementById('revision-corner-sort-style')) {
            const style = document.createElement('style');
            style.id = 'revision-corner-sort-style';
            style.textContent = '.revision-sort-scroll::-webkit-scrollbar{display:none;}';
            document.head.appendChild(style);
        }

        function getRevisionCornerChapterMetrics(ch, sub) {
            const study = Math.min(100, Math.round(
                ((Number(ch.study?.book) || 0) + (Number(ch.study?.class) || 0) +
                 (Number(ch.study?.summary) || 0) + (Number(ch.study?.notes) || 0)) / 4
            ));
            const cq = Number(ch.cqTarget) > 0 ? Math.min(100, Math.round((Number(ch.cqSolved) || 0) / Number(ch.cqTarget) * 100)) : 0;
            const mcq = Number(ch.mcqTarget) > 0 ? Math.min(100, Math.round((Number(ch.mcqSolved) || 0) / Number(ch.mcqTarget) * 100)) : 0;
            const sq = Number(ch.sqTarget) > 0 ? Math.min(100, Math.round((Number(ch.sqSolved) || 0) / Number(ch.sqTarget) * 100)) : 0;
            return { study, cq, mcq, sq, progress: Math.min(100, Number(getChapterProgress(ch, sub.id)) || 0) };
        }

        function periodicElementByNumber(n) { return PERIODIC_TABLE_ELEMENTS.find(e => e.number === Number(n)); }

            if (!e) return '<div class="periodic-empty"></div>';
            const n = Math.max(1, Number(e.number || 1));
            const index = Math.max(0, Math.min(125, n - 1));
            // Keep every element in its final grid position from the first frame.
            // The opening animation is applied independently after the page mounts.
            const delay = Math.round((index % 18) * 9 + Math.floor(index / 18) * 7);
            return `<button type="button" class="periodic-element ${periodicCategoryClass(e.category)}" style="--pt-index:${index};--pt-delay:${delay}ms;" onclick="showPeriodicElement(${e.number})" aria-label="${e.name}">

        function periodicMainGrid() {
            const cells = Array.from({length:126},()=>'<div class="periodic-empty"></div>');
            const put=(period,group,html)=>{ cells[(period-1)*18+(group-1)] = html; };
            PERIODIC_TABLE_ELEMENTS.forEach(e=>{
                if(e.period<=7 && e.group && e.block!=='f') put(e.period,e.group,periodicCell(e));
            });
            // The conventional long-form table keeps the lanthanide/actinide series
            // represented by a single bridge cell in groups 3 of periods 6 and 7.
            put(6,3,periodicPlaceholder('La–Lu'));
            put(7,3,periodicPlaceholder('Ac–Lr'));
            return `<div class="periodic-grid-wrap"><div class="periodic-grid-labels"><span></span>${Array.from({length:18},(_,i)=>`<span>${i+1}</span>`).join('')}</div><button type="button" class="periodic-back-center" onclick="closePeriodicTablePage()" aria-label="বিষয়সমূহে ফিরে যান"><i class="fa-solid fa-arrow-left"></i><span>Back</span></button><div class="periodic-grid">${cells.join('')}</div></div>`;

        const REVISION_CONSTANT_CATEGORY_LABELS = {

            'Chemistry':'রসায়ন'
        };
        let revisionConstantsActiveCategory = 'All';
        let revisionConstantsSearch = '';

        function constantsEscape(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[ch]));
        }

        function constantsSearchMatch(item, query) {
            if (!query) return true;
            const q = query.toLowerCase().trim();
            return [item.name,item.bn,item.symbol,item.value,item.unit,item.cat,item.desc]
                .some(v => String(v || '').toLowerCase().includes(q));
        }

        function constantsGetFiltered() {
            return REVISION_CONSTANTS_DATA.filter(item => {
                const categoryOk = revisionConstantsActiveCategory === 'All' || item.cat === revisionConstantsActiveCategory;
                return categoryOk && constantsSearchMatch(item, revisionConstantsSearch);
            });
        }

        function constantsFormatValue(value) {
            return constantsEscape(value).replace(/ × 10⁻([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, ' × 10<sup>−$1</sup>')
                .replace(/ × 10([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, ' × 10<sup>$1</sup>');
        }

        function constantsCopyValue(index) {
            const item = REVISION_CONSTANTS_DATA[index];
            if (!item) return;
            const payload = `${item.name} (${item.symbol}) = ${item.value} ${item.unit}`;
            const done = () => {
                const btn = document.querySelector(`[data-constants-copy="${index}"]`);
                if (!btn) return;
                const old = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                btn.style.color = '#16a34a';
                btn.style.borderColor = '#bbf7d0';
                setTimeout(() => {
                    if (btn.isConnected) {
                        btn.innerHTML = old;
                        btn.style.color = '';
                        btn.style.borderColor = '';
                    }
                }, 1100);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(payload).then(done).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = payload; ta.style.position='fixed'; ta.style.opacity='0';
                    document.body.appendChild(ta); ta.select();
                    try { document.execCommand('copy'); } catch(e) {}
                    ta.remove(); done();
                });
            } else {
                const ta = document.createElement('textarea');
                ta.value = payload; ta.style.position='fixed'; ta.style.opacity='0';
                document.body.appendChild(ta); ta.select();
                try { document.execCommand('copy'); } catch(e) {}
                ta.remove(); done();
            }
        }

                if (!group) { group = {cat:item.cat, items:[]}; groups.push(group); }
                group.items.push(item);
            });

                'Electromagnetic':'তড়িৎ আধান, বৈদ্যুতিক ক্ষেত্র ও চৌম্বকীয় রেফারেন্স ধ্রুবক।',

                'Chemistry':'রসায়নে প্রায়ই ব্যবহৃত রেফারেন্স ধ্রুবক।'
            };

            let body = '';
            groups.forEach(group => {
                body += `
                    <section class="constants-category" data-category="${constantsEscape(group.cat)}">
                        <div class="constants-category-head">
                            <div class="constants-category-title">${constantsEscape(group.cat)}</div>
                            <div class="constants-category-desc">${constantsEscape(categoryDescriptions[group.cat] || '')}</div>
                        </div>
                        <div class="constants-table-wrap">
                            <table class="constants-table">
                                <thead><tr>
                                    <th>ধ্রুবকের নাম</th><th>প্রতীক</th><th>মান</th><th>SI একক</th><th>সংক্ষিপ্ত বর্ণনা</th><th></th>
                                </tr></thead>
                                <tbody>
                                    ${group.items.map((item, localIndex) => {
                                        const index = REVISION_CONSTANTS_DATA.indexOf(item);
                                        return `<tr style="--constants-row-index:${localIndex};">
                                            <td><div class="constants-name">${constantsEscape(item.name)}<span class="constants-bn">${constantsEscape(item.bn)}</span></div></td>
                                            <td><span class="constants-symbol">${constantsEscape(item.symbol)}</span></td>
                                            <td><span class="constants-value">${constantsFormatValue(item.value)}</span></td>
                                            <td><span class="constants-unit">${constantsEscape(item.unit)}</span></td>
                                            <td><div class="constants-description">${constantsEscape(item.desc)}</div></td>
                                            <td><button type="button" class="constants-copy" data-constants-copy="${index}" onclick="constantsCopyValue(${index})" title="রেফারেন্স মান কপি করুন" aria-label="${constantsEscape(item.name)} কপি করুন"><i class="fa-regular fa-copy"></i></button></td>
                                        </tr>`;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </section>`;
            });

            if (!body) body = `<div class="constants-empty"><i class="fa-solid fa-magnifying-glass mb-2"></i><div>কোনো মিলযুক্ত ধ্রুবক পাওয়া যায়নি।</div><div class="mt-1 font-semibold">অন্য কোনো ধ্রুবক বা বিভাগ নির্বাচন করুন।</div></div>`;

            return body;
        }

        function renderConstantsReferencePage() {
            const page = document.getElementById('revision-constants-page');

            if (clear) clear.style.display = revisionConstantsSearch ? 'grid' : 'none';

            if(overlay) overlay.classList.add('periodic-overlay');

            // Visually place the elements one-by-one, in reading order.
            const table = content ? content.querySelector('.periodic-table-inner') : null;
            if(table){
                const items = Array.from(table.querySelectorAll('.periodic-element, .periodic-placeholder'));
                table.classList.add('periodic-sequence-ready');

                requestAnimationFrame(() => {
                    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                    items.forEach((el, i) => {
                        const delay = Math.min(i * 24, 3000);
                        if(reduceMotion){
                            el.style.opacity = '1';
                            el.style.transform = 'none';
                            return;
                        }
                        if(typeof el.animate === 'function'){
                            el.animate([
                                {opacity:0, transform:'translate3d(0,-22px,0) scale(.72) rotate(-7deg)', filter:'brightness(.9)'},
                                {opacity:1, transform:'translate3d(0,3px,0) scale(1.045) rotate(1.5deg)', filter:'brightness(1.08)', offset:.55},

                                {opacity:1, transform:'translate3d(0,0,0) scale(1) rotate(0)', filter:'brightness(1)'}
                            ], {
                                duration:340,
                                delay:delay,
                                easing:'cubic-bezier(.2,.9,.3,1)',
                                fill:'both'
                            });
                        }else{
                            el.classList.add('periodic-sequence-fallback');
                            el.style.animationDelay = delay + 'ms';
                        }
                    });
                });
            }

        function getRevisionLightSubjectColor(hex) {
            const h = String(hex || '').replace('#','').trim();

            const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
            const mix = (v) => Math.round(v + (255-v) * 0.88);
            return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
        }

                                    ? `<h4 class="m-0 flex items-center gap-1.5 min-w-0 font-extrabold text-slate-800 text-sm leading-snug"><span class="revision-subject-chapter-badge" style="--subject-chapter-color:${sub.themeColor};">${ch.origNum}</span><span class="min-w-0">${ch.name}${completeBadge}</span></h4>`

                                ${subjectGoMode

                                           <div class="re-examined-revision-dots revision-subject-revision-dots" style="margin-top:4px !important;" aria-label="${getRevisionProgress(ch)} revision${getRevisionProgress(ch) === 1 ? '' : 's'}">${Array.from({length:getRevisionProgress(ch)},()=>'<span class="re-examined-revision-dot"></span>').join('')}</div>

        function renderRevisionCornerGlobalChapters(subjects) {
            let all = [];
            subjects.forEach(sub => (sub.chapters || []).forEach(ch => all.push({ sub, ch })));

            // For global Chapter Order, randomize the complete mixed pool so chapters
            // from different subjects are genuinely interleaved.
            if (revisionCornerSort === 'chapter-order') {
                for (let i = all.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [all[i], all[j]] = [all[j], all[i]];
                }
            } else {
                all.sort((a, b) => {
                    if (revisionCornerSort === 'highest-progress') return getChapterProgress(b.ch, b.sub.id) - getChapterProgress(a.ch, a.sub.id);
                    if (revisionCornerSort === 'lowest-progress') return getChapterProgress(a.ch, a.sub.id) - getChapterProgress(b.ch, b.sub.id);
                    if (revisionCornerSort === 'highest-revision' || revisionCornerSort === 'lowest-revision') {
                        // Same count-first rule as Subjects → Go, with zero-revision
                        // chapters ordered by lowest → highest actual chapter progress.
                        const ar = getRevisionProgress(a.ch);
                        const br = getRevisionProgress(b.ch);
                        const aZero = ar <= 0;
                        const bZero = br <= 0;

                        if (aZero !== bZero) return aZero ? 1 : -1;

                        if (!aZero && !bZero) {
                            const direction = revisionCornerSort === 'highest-revision' ? -1 : 1;
                            const diff = (ar - br) * direction;
                            if (diff !== 0) return diff;
                        } else {
                            // Zero-revision group follows the same direction as Subjects → Go:
                            // Revision ↑ = progress high → low, Revision ↓ = progress low → high.
                            const ap = getChapterProgress(a.ch, a.sub.id);
                            const bp = getChapterProgress(b.ch, b.sub.id);
                            const diff = revisionCornerSort === 'highest-revision'
                                ? (bp - ap)
                                : (ap - bp);
                            if (diff !== 0) return diff;
                        }

                        const subDiff = String(a.sub.id).localeCompare(String(b.sub.id));
                        if (subDiff !== 0) return subDiff;
                        return (Number(a.ch.origNum) || 0) - (Number(b.ch.origNum) || 0);
                    }
                    if (revisionCornerSort === 'cq-importance') {
                        const ac = hasCQData(a.ch), bc = hasCQData(b.ch);
                        if (ac !== bc) return ac ? -1 : 1;
                        return (Number(b.ch.cqPastCount) || 0) - (Number(a.ch.cqPastCount) || 0);
                    }
                    if (revisionCornerSort === 'mcq-importance') {
                        const ac = hasMCQData(a.ch), bc = hasMCQData(b.ch);
                        if (ac !== bc) return ac ? -1 : 1;
                        return (Number(b.ch.mcqPastCount) || 0) - (Number(a.ch.mcqPastCount) || 0);
                    }
                    return 0;
                });
            }

            return `

                        <span class="text-xs font-bold text-slate-500">Sort By</span>

                    <div class="space-y-3">
                        ${all.map((item, index) => revisionCornerChapterCard(item.sub, item.ch, true, false, index)).join('')}
                    </div>
                </div>
            `;
        }

                                 class="w-14 h-20 rounded-xl object-cover border border-white shadow-sm">
                            <div class="flex-1 min-w-0">

        // --- DASHBOARD PAGE ---
        let currentBoardImpMode = 'CQ';
        let selectedDashSubId = null;
        let progressGraphAnimationToken = 0;
        let activeProgressGraphAnimationCancel = null;

        function renderDashboard(animateChapterImportance = false, animateProgressGraph = false, animateHeading = false, animateCountdown = false) {
            const app = document.getElementById('app');

            // Any ordinary Dashboard re-render invalidates an older animation.
            // Only an explicitly requested progress-graph animation gets a new run.
            if (!animateProgressGraph) progressGraphAnimationToken++;
            dashboardCountdownAnimationToken++;

            if (!selectedDashSubId || !appState.subjects.some(s => s.id === selectedDashSubId)) {
                selectedDashSubId = appState.subjects[0].id;
            }

            const sscWeeks = Math.floor(getDaysRemaining(appState.dates.sscExam) / 7);
            const testWeeks = Math.floor(getDaysRemaining(appState.dates.testExam) / 7);

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const jsDay = today.getDay();
            // The app week is Saturday → Friday. Keep every day tied to its real
            // local calendar date instead of placeholder/hard-coded graph values.
            const currentDayIdx = (jsDay + 1) % 7;
            const daysOfWeek = ['Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
            const dayCoordsBase = [
                {x: 10}, {x: 55}, {x: 100}, {x: 145}, {x: 190}, {x: 235}, {x: 280}
            ];

            function toLocalDateKey(date) {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            function getWeekStartDate(offset = 0) {
                const start = new Date(today);
                const daysFromSaturday = (today.getDay() + 1) % 7;
                start.setDate(start.getDate() - daysFromSaturday + (offset * 7));
                return start;
            }

            function getDailyActivityForDate(date) {
                const key = toLocalDateKey(date);
                const log = appState.dailyLogs?.[key];
                if (!log || typeof log !== 'object') return 0;
                if (Number.isFinite(Number(log.total))) return Math.max(0, Number(log.total));
                return Math.max(0, (Number(log.cq) || 0) + (Number(log.mcq) || 0) + (Number(log.sq) || 0));
            }

            const monthlyUnlocked = hasOneFullCalendarMonthOfHistory();
            let graphDates = [];
            let plotDaysCount = 0;
            let rawValues = [];
            let plottedValues = [];
            let maxActivity = 1;
            let dayCoords = [];
            let graphTitle = appState.weekOffset === 0 ? 'This Week' : 'Pre Week';
            let graphLabelsHtml = '';
            let graphModeIsMonth = progressGraphMode === 'month' && monthlyUnlocked;
            const monthBounds = getMonthlyGraphBounds();
            const weekBounds = getWeeklyGraphBounds();
            const monthHistoryNABoundary = graphModeIsMonth && monthOffset < monthBounds.minOffset;
            const weekHistoryNABoundary = !graphModeIsMonth && appState.weekOffset < weekBounds.minOffset;

            if (monthHistoryNABoundary) {
                graphTitle = 'N/A';
            } else if (graphModeIsMonth) {
                monthOffset = Math.max(monthBounds.minOffset, Math.min(monthBounds.maxOffset, monthOffset));
                graphDates = getMonthlyGraphDates(monthOffset);
                rawValues = graphDates.map(getDailyActivityForDate);
                // For the currently running month, plot only through yesterday.
                // Historical months retain their existing full-month behavior.
                plotDaysCount = monthOffset === 0
                    ? Math.max(0, Math.min(graphDates.length, today.getDate() - 1))
                    : graphDates.length;
                plottedValues = rawValues.slice(0, plotDaysCount);
                maxActivity = Math.max(1, ...plottedValues);
                // Month graph uses one real point and one visible label for EVERY
                // calendar day. Give each day a fixed horizontal slot so 30/31-day
                // months remain readable and naturally become horizontally scrollable.
                const monthDayWidth = 28;
                const monthGraphWidth = Math.max(300, (graphDates.length * monthDayWidth) + monthDayWidth);
                const monthXPadding = 14;
                const monthPlotWidth = Math.max(0, monthGraphWidth - (monthXPadding * 2));
                const xStep = graphDates.length > 1 ? monthPlotWidth / (graphDates.length - 1) : 0;
                dayCoords = graphDates.map((date, idx) => {
                    const value = rawValues[idx];
                    const y = 90 - (Math.min(value, maxActivity) / maxActivity) * 70;
                    return { x: Number((monthXPadding + idx * xStep).toFixed(2)), y: Number(y.toFixed(2)), value };
                });
                graphTitle = getMonthLabel(graphDates[0] || getLatestHistoricalDate());
                graphLabelsHtml = graphDates.map((date) => {
                    return `<span class="text-[9px] font-bold text-slate-400 text-center flex-none" style="width:${monthDayWidth}px">${date.getDate()}</span>`;
                }).join('');
            } else if (weekHistoryNABoundary) {
                graphTitle = 'N/A';
            } else {
                const weekStart = getWeekStartDate(appState.weekOffset);
                graphDates = daysOfWeek.map((_, idx) => {
                    const d = new Date(weekStart);
                    d.setDate(weekStart.getDate() + idx);
                    return d;
                });
                // For This Week, plot only through yesterday. Previous weeks keep
                // their existing full 7-day behavior.
                plotDaysCount = appState.weekOffset === 0 ? currentDayIdx : 7;
                rawValues = graphDates.map(getDailyActivityForDate);
                plottedValues = rawValues.slice(0, plotDaysCount);
                maxActivity = Math.max(1, ...plottedValues);
                dayCoords = dayCoordsBase.map((point, idx) => {
                    const value = rawValues[idx];
                    const y = 90 - (Math.min(value, maxActivity) / maxActivity) * 70;
                    return { x: point.x, y: Number(y.toFixed(2)), value };
                });
                graphLabelsHtml = daysOfWeek.map((day, idx) => `<span class="${currentDayIdx === idx && appState.weekOffset === 0 ? 'text-cyan-600 font-extrabold' : ''}">${day}</span>`).join('');
            }

            let pathD = "";
            let areaD = "";

            // Smooth cubic curve through the real daily activity points.
            function buildSmoothPath(points) {
                if (!points.length) return '';
                if (points.length === 1) return `M ${points[0].x} ${points[0].y}`;
                let d = `M ${points[0].x} ${points[0].y}`;
                for (let i = 0; i < points.length - 1; i++) {
                    const p0 = points[i - 1] || points[i];
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    const p3 = points[i + 2] || p2;
                    const cp1x = p1.x + (p2.x - p0.x) / 6;
                    const cp1y = p1.y + (p2.y - p0.y) / 6;
                    const cp2x = p2.x - (p3.x - p1.x) / 6;
                    const cp2y = p2.y - (p3.y - p1.y) / 6;
                    d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
                }
                return d;
            }

            if (plotDaysCount > 0) {
                const plotPoints = dayCoords.slice(0, plotDaysCount);

                <!-- CHAPTER BOARD IMPORTANCE GRAPH CARD -->

                    <!-- CQ / MCQ TOGGLE BUTTONS FOR IMPORTANCE GRAPH -->
                    <div class="flex justify-center gap-3 pt-1" id="imp-toggle-container">
                        <button id="imp-btn-cq" onclick="setBoardImpMode('CQ')" class="px-5 py-1.5 rounded-xl text-xs font-bold shadow-sm transition-all duration-200">
                            [ CQ ]
                        </button>
                        <button id="imp-btn-mcq" onclick="setBoardImpMode('MCQ')" class="px-5 py-1.5 rounded-xl text-xs font-bold shadow-sm transition-all duration-200">
                            [ MCQ ]
                        </button>

            // Suppress only the Chapter Importance toggle-button transition while the
            // Dashboard is being rebuilt by Week/Month graph interactions. The
            // button's normal transition remains unchanged for its own interactions.
            app.classList.add('dashboard-graph-interaction-render');
            app.innerHTML = html;
            setupWeeklySwipe();

            if (animateHeading) {
                requestAnimationFrame(animateDashboardHeading);
            }

            renderBuildingChart(selectedDashSubId, animateChapterImportance);
            app.classList.remove('dashboard-graph-interaction-render');

            // Progress graph animation is deliberately opt-in. Normal Dashboard
            // re-renders (data edits, subject selection, navigation, etc.) never
            // replay it.
            if (animateProgressGraph) {
                requestAnimationFrame(() => animateDashboardProgressGraph(graphModeIsMonth));
            }

            // Countdown animation is also explicitly replayed when Settings are
            // successfully saved while already on Dashboard. Ordinary Dashboard
            // re-renders (including closing/cancelling Settings or Notifications)
            // never replay this animation.
            if (animateCountdown && welcomePopupDismissed) {
                requestAnimationFrame(() => {
                    const sscWeeks = Math.floor(getDaysRemaining(appState.dates.sscExam) / 7);
                    const testWeeks = Math.floor(getDaysRemaining(appState.dates.testExam) / 7);
                    const countdownRunToken = dashboardCountdownAnimationToken;
                    animateNumber('dash-ssc-weeks-num', 62, sscWeeks, 1200, countdownRunToken);
                    animateNumber('dash-test-weeks-num', 42, testWeeks, 1200, countdownRunToken);
                });
