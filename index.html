                input.type = 'file';
                input.accept = '.json,application/json';
                input.id = 'study-tracker-import-input';
                input.className = 'hidden';
                input.onchange = () => {
                    const file = input.files?.[0];
                    if (file) importCompleteUserData(file);
                    input.value = '';
                };
                document.body.appendChild(input);
            }
            input.click();
        }

        async function restoreStoredImages(images) {
            // Restore only the permanent application images represented by the
            // JSON Backup `images` structure: profile + the 10 book covers.
            // Other app-private media (Inbox/Revision) remains untouched because
            // it is not part of this 11-image JSON backup structure.
            const imageObject = images && typeof images === 'object' ? images : {};
            const allowedKeys = new Set(['profile', ...DEFAULT_SUBJECTS.map(sub => 'cover:' + sub.id)]);
            const entries = Object.entries(imageObject).filter(([key, dataUrl]) =>
                allowedKeys.has(String(key)) &&
                typeof dataUrl === 'string' &&
                dataUrl.startsWith('data:')
            );
            const db = await openImageDB();

            await new Promise((resolve, reject) => {
                const tx = db.transaction(IMAGE_STORE, 'readwrite');
                const store = tx.objectStore(IMAGE_STORE);

                // Remove the existing permanent profile/cover images first so
                // an imported backup also correctly restores intentional deletions.
                allowedKeys.forEach(key => store.delete(key));

                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            });

            await Promise.all(entries.map(([key, dataUrl]) =>
                saveImageBlob(key, dataUrlToBlob(dataUrl))
            ));
        }

        function isValidStudyTrackerBackup(payload) {
            if (!payload || typeof payload !== 'object') return false;
            const state = payload.appState;
            if (!state || typeof state !== 'object') return false;
            if (!Array.isArray(state.subjects) || !state.user || typeof state.user !== 'object') return false;
            if (!state.dates || typeof state.dates !== 'object') return false;
            if (!state.dataVersion || typeof state.dataVersion !== 'number') return false;
            if (state.dailyLogs !== undefined && (!state.dailyLogs || typeof state.dailyLogs !== 'object' || Array.isArray(state.dailyLogs))) return false;
            if (state.dailyLogs) {
                for (const [dateKey, log] of Object.entries(state.dailyLogs)) {
                    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey) || !log || typeof log !== 'object') return false;
                    if (![log.cq, log.mcq, log.sq, log.total].every(v => v === undefined || Number.isFinite(Number(v)))) return false;
                }
            }
            // New backups are metadata-only for media. Legacy backups may still
            // contain `images`; keep accepting them for backward compatibility.
            if (payload.images !== undefined && payload.images !== null && typeof payload.images !== 'object') return false;
            if (payload.mediaManifest !== undefined && !Array.isArray(payload.mediaManifest)) return false;

            const requiredSubjectIds = DEFAULT_SUBJECTS.map(s => s.id);
            const importedIds = state.subjects.map(s => s && s.id);
            if (importedIds.length !== requiredSubjectIds.length) return false;
            if (!requiredSubjectIds.every(id => importedIds.includes(id))) return false;

            return state.subjects.every(s =>
                s && typeof s === 'object' &&
                typeof s.id === 'string' &&
                typeof s.name === 'string' &&
                Array.isArray(s.chapters) &&
                s.chapters.every(ch =>
                    ch && typeof ch === 'object' &&
                    typeof ch.id === 'string' &&
                    typeof ch.origNum === 'number' &&
                    typeof ch.name === 'string' &&
                    ch.study && typeof ch.study === 'object'
                )
            );
        }


        function playImportUploadAnimation() {
            return new Promise(resolve => {
                const contentHtml = `
                    <div class="import-upload-animation-card" role="status" aria-live="polite" aria-label="Importing backup data">
                        <div class="import-upload-stage">
                            <div class="import-storage-box">
                                <div class="import-storage-top"><div class="import-storage-slot"></div></div>
                                <div class="import-storage-glow"></div>
                                <div class="import-upload-success-fill"></div>
                                <div class="import-storage-label">Backup Data Center</div>
                                <div class="import-upload-success-ring"></div>
                                <div class="import-upload-check"><i class="fa-solid fa-check"></i></div>
                            </div>
                            <div class="import-upload-file" aria-hidden="true">
                                <div class="import-upload-file-paper">
                                    <div class="import-upload-file-fold"></div>
                                    <div class="import-upload-file-icon"><i class="fa-solid fa-database"></i></div>
                                    <div class="import-upload-file-title">New Backup Data</div>
                                    <div class="import-upload-file-line"></div>
                                    <div class="import-upload-file-line short"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                showModal(contentHtml);
                document.body.classList.add('import-animation-fixed');

                // Main animation first, then a clean one-second circular loader.
                setTimeout(() => {
                    const stage = document.querySelector('.import-upload-animation-card');
                    if (!stage) {
                        resolve();
                        return;
                    }

                    stage.innerHTML = `
                        <div class="import-upload-premium-loader-wrap">
                            <div class="import-upload-premium-loader" aria-hidden="true">
                                <div class="import-upload-premium-loader-track"></div>
                                <div class="import-upload-premium-loader-arc"></div>
                            </div>
                            <div class="import-upload-backup-status">
                                Data Restoring Up<span class="import-upload-backup-dots">.</span>
                            </div>
                        </div>
                    `;

                    const backupDots = stage.querySelector('.import-upload-backup-dots');
                    const dotSequence = ['.', '..', '...'];
                    let dotIndex = 0;
                    const dotTimer = setInterval(() => {
                        if (backupDots) {
                            backupDots.textContent = dotSequence[dotIndex % dotSequence.length];
                            dotIndex++;
                        }
                    }, 260);

                    setTimeout(() => {
                        clearInterval(dotTimer);
                        document.body.classList.remove('import-animation-fixed');
                        closeModal();
                        resolve();
                    }, 2500);
                }, 2050);
            });
        }
        async function importCompleteUserData(file) {
            let payload;
            try {
                if (!/\.json$/i.test(file.name) && file.type && file.type !== 'application/json') {
                    showBackupMessagePopup('Warning / Notice', 'শুধুমাত্র বৈধ <b>.json</b> backup file নির্বাচন করুন।', 'OK', 'fa-triangle-exclamation', 'text-amber-600', 'bg-[#F8B337]');
                    return;
                }

                const text = await file.text();
                try {
                    payload = JSON.parse(text);
                } catch (e) {
                    showBackupMessagePopup('Warning / Error', 'এই backup file-এর JSON structure সঠিক নয়। তাই Import করা হয়নি।', 'OK', 'fa-triangle-exclamation', 'text-red-600', 'bg-red-500');
                    return;
                }

                if (!isValidStudyTrackerBackup(payload)) {
                    showBackupMessagePopup('Warning / Error', 'Backup/data গ্রহণ করা যাচ্ছে না। File বা backup structure ভুল/অসম্পূর্ণ হওয়ায় Import সফল হয়নি। আপনার বর্তমান data অপরিবর্তিত আছে।', 'OK', 'fa-triangle-exclamation', 'text-red-600', 'bg-red-500');
                    return;
                }

                const confirmed = await new Promise(resolve => {
                    const contentHtml = `
                        <div class="space-y-5 text-center">
                            <div class="mx-auto w-14 h-14 rounded-2xl bg-[#F8B337]/15 text-[#F8B337] flex items-center justify-center">
                                <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                            </div>
                            <div class="space-y-2">
                                <h3 class="text-base font-extrabold text-slate-800">Warning / Notice</h3>
                                <p class="text-xs leading-relaxed text-slate-500 font-medium">
                                    নির্বাচিত backup data অ্যাপ্লিকেশনের বর্তমান data-এর জায়গায় Import/Apply করা হবে।
                                    বর্তমান সংরক্ষিত data backup data দিয়ে replace হবে। আপনি কি এটি নিশ্চিত করতে চান?
                                </p>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <button type="button" onclick="closeModal(); window.__studyTrackerImportConfirm(false)"
                                    class="w-full py-3.5 bg-slate-100 text-slate-700 font-bold text-sm rounded-xl shadow-sm active:scale-95 transition-all">
                                    Cancel
                                </button>
                                <button type="button" onclick="closeModal(); window.__studyTrackerImportConfirm(true)"
                                    class="w-full py-3.5 bg-[#F8B337] text-white font-bold text-sm rounded-xl shadow-md active:scale-95 transition-all">
                                    Import
                                </button>
                            </div>
                        </div>
                    `;
                    window.__studyTrackerImportConfirm = resolve;
                    showModal(contentHtml);
                });

                delete window.__studyTrackerImportConfirm;
                if (!confirmed) return;

                // Prepare everything before changing appState. If preparation fails,
                // the current appState and stored data remain untouched.
                const importedState = JSON.parse(JSON.stringify(payload.appState));
                sanitizeRevisionEntries(importedState);
                sanitizeRevisionMediaForBackup(importedState);
                importedState.user = importedState.user || {};
                importedState.user.name = (typeof importedState.user.name === 'string' && importedState.user.name.trim()) ? importedState.user.name : 'নাদিম হোসেন';
                importedState.user.welcomeName = (typeof importedState.user.welcomeName === 'string' && importedState.user.welcomeName.trim()) ? importedState.user.welcomeName : 'NADIM';
                importedState.dataVersion = DATA_VERSION;
                importedState.dailyLogs = (importedState.dailyLogs && typeof importedState.dailyLogs === 'object' && !Array.isArray(importedState.dailyLogs))
                    ? importedState.dailyLogs : {};
                importedState.notes = Array.isArray(importedState.notes) ? importedState.notes : [];
                normalizeBangla1ChapterStructure(importedState.subjects);

                const oldState = appState;
                const legacyMediaPayload = payload.images && typeof payload.images === 'object' && Object.keys(payload.images).length > 0;
                const oldProfileObjectUrl = profileObjectUrl;
                const oldCoverObjectUrls = { ...coverObjectUrls };

                try {
                    // Apply state using the existing localStorage mechanism.
                    appState = importedState;
                    // Restore the theme saved inside the backup as well.
                    appState.theme = importedState.theme === 'dark' ? 'dark' : 'light';
                    applyAppTheme(appState.theme);
                    appState.weekOffset = 0;
                    progressGraphMode = 'week';
                    monthOffset = 0;
                    lastWeekGraphOffset = 0;
                    lastMonthGraphOffset = 0;
                    saveStorage();

                    // New metadata-only backups must NOT clear the app-private
                    // media store: matching storage keys remain available, while
                    // missing keys are rendered as placeholders. Legacy backups
                    // that contain actual media are still restored for compatibility.
                    if (legacyMediaPayload) {
                        await restoreStoredImages(payload.images);
                    }

                    if (profileObjectUrl) {
                        URL.revokeObjectURL(profileObjectUrl);
                        profileObjectUrl = '';
                    }
                    Object.keys(coverObjectUrls).forEach(id => {
                        if (coverObjectUrls[id]) URL.revokeObjectURL(coverObjectUrls[id]);
                        delete coverObjectUrls[id];
                    });

                    await hydrateStoredImages();

                    closeModal();
                    switchTab(appState.activeTab === 'dashboard' ? 'dashboard' : 'home');

                    const welcomeImg = document.getElementById('welcome-profile-img');
                    if (welcomeImg) welcomeImg.src = getStoredProfileImageSrc();
                    const welcomeName = document.getElementById('welcome-name');
                    if (welcomeName) welcomeName.textContent = formatWelcomeName(appState.user.welcomeName || 'NADIM');

                    await playImportUploadAnimation();

                    // Keep the existing Import Successful popup unchanged; show it after the animation.
                    showBackupMessagePopup('Import Successful', 'ডাটা সফলভাবে Import/Restore হয়েছে এবং backup সফলভাবে সেট করা হয়েছে।', 'OK', 'fa-circle-check', 'text-emerald-600', 'bg-[#F8B337]');
                } catch (applyError) {
                    console.error('Import/restore failed:', applyError);

                    // Best-effort rollback of application state. Metadata-only
                    // imports never replace the app-private media store, so there
                    // is no media rollback operation to perform in that case.
                    appState = oldState;
                    saveStorage();
                    if (legacyMediaPayload) {
                        console.warn('Legacy media import failed; existing media storage was not reconstructed during rollback.');
                    }

                    if (profileObjectUrl && profileObjectUrl !== oldProfileObjectUrl) {
                        URL.revokeObjectURL(profileObjectUrl);
                    }
                    Object.keys(coverObjectUrls).forEach(id => {
                        if (coverObjectUrls[id] && coverObjectUrls[id] !== oldCoverObjectUrls[id]) {
                            URL.revokeObjectURL(coverObjectUrls[id]);
                        }
                        delete coverObjectUrls[id];
                    });
                    Object.assign(coverObjectUrls, oldCoverObjectUrls);
                    profileObjectUrl = oldProfileObjectUrl || '';
                    await hydrateStoredImages().catch(() => {});

                    showBackupMessagePopup('Warning / Error', 'Backup restore করা যায়নি। বর্তমান data পরিবর্তন করা হয়নি।', 'OK', 'fa-triangle-exclamation', 'text-red-600', 'bg-red-500');
                }
            } catch (e) {
                console.error('Import/restore failed:', e);
                showBackupMessagePopup('Warning / Error', 'Backup/data গ্রহণ করা যাচ্ছে না। Import সফল হয়নি এবং বর্তমান data অপরিবর্তিত আছে।', 'OK', 'fa-triangle-exclamation', 'text-red-600', 'bg-red-500');
            }
        }

        // --- MODAL UTILITIES ---
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.getElementById('revision-picture-viewer-overlay')) closeRevisionPictureViewer(); });

        function showModal(contentHtml) {
            const modalOverlay = document.getElementById('modal-overlay');
            const modalContent = document.getElementById('modal-content');
            if (modalOverlay && modalContent) {
                modalContent.innerHTML = contentHtml;
                modalOverlay.classList.remove('hidden');
            }
        }

        function stopAllRevisionAudio() {
            Object.keys(revisionAudioPlayers || {}).forEach(key => {
                const player = revisionAudioPlayers[key];
                try { if (player) player.pause(); } catch (e) {}
                try { if (player) player.currentTime = 0; } catch (e) {}
                try { if (player) player.src = ''; } catch (e) {}
                delete revisionAudioPlayers[key];
            });
        }

        function closeModal() {
            stopAllRevisionAudio();
            stopRevisionSetupAudioPlayers();
            if (typeof stopAllInboxNoteAudio === 'function') stopAllInboxNoteAudio();
            const modalOverlay = document.getElementById('modal-overlay');
            const modalContent = document.getElementById('modal-content');
            if (modalOverlay) {
                modalOverlay.classList.add('hidden');
                modalOverlay.classList.remove('periodic-overlay');
            }
            if (modalContent) modalContent.classList.remove('periodic-modal-content');
            currentSort = 'default';
            homeSubjectScrollRestore = null;
            revisionCornerScrollRestore = null;
        }

        // Close modal on clicking overlay backdrop
        document.getElementById('modal-overlay')?.addEventListener('click', (e) => {
            if (e.target.id === 'modal-overlay') {
                if (settingsSessionActive) cancelSettingsSession();
                else closeModal();
            }
        });

        // Close subject selector popup modal on clicking backdrop
        document.getElementById('subject-modal-overlay')?.addEventListener('click', (e) => {
            if (e.target.id === 'subject-modal-overlay') {
                closeSubjectModal();
            }
        });

        // --- APP INITIALIZATION ON WINDOW LOAD ---
        window.onload = function () {
            loadStorage();
            applyAppTheme(appState.theme || 'light');

            // Always start the application on the Home page.
            appState.activeTab = 'home';
            document.body.classList.remove('pb-24');
            document.body.classList.remove('pb-24', 'pb-[112px]');
            document.body.classList.add('pb-[136px]');

            // Render immediately with built-in placeholders; private images hydrate asynchronously.
            const welcomeImg = document.getElementById('welcome-profile-img');
            if (welcomeImg) welcomeImg.src = BUILTIN_AVATAR_PLACEHOLDER;
            const welcomeName = document.getElementById('welcome-name');
            if (welcomeName) welcomeName.textContent = formatWelcomeName(appState.user.welcomeName || 'NADIM');

            renderHome();
            startHomeGreetingAnimation();

            hydrateStoredImages().then(() => {
                if (welcomeImg) welcomeImg.src = getStoredProfileImageSrc();
                if (appState.activeTab === 'home') renderHome();
                else renderDashboard();
            }).catch(e => console.error('Image hydration error:', e));

            // STARTUP SEQUENCE:
            // 1) Real Home Page is already rendered underneath.
            // 2) Full-screen blur stays for exactly 1 second.
            // 3) Existing Welcome Popup is then shown for exactly 1 second.
            // 4) Existing Welcome Popup fade/behavior is preserved.
            const startupOverlay = document.getElementById('startup-blur-overlay');
            const popupOverlay = document.getElementById('welcome-popup-overlay');

            // Keep the startup layer above everything for the first second.
            setTimeout(() => {
                if (startupOverlay) {
                    startupOverlay.style.opacity = '0';
                    startupOverlay.style.pointerEvents = 'none';
                    setTimeout(() => {
                        startupOverlay.style.display = 'none';
                    }, 300);
                }

                // Start the existing Welcome Popup only after the 1-second blur period.
                if (popupOverlay) {
                    popupOverlay.style.display = 'flex';
                    popupOverlay.classList.remove('opacity-0', 'pointer-events-none');
                    popupOverlay.classList.add('opacity-100');
                    const scienceLine = popupOverlay.querySelector('.welcome-science-line');
                    if (scienceLine) {
                        scienceLine.classList.remove('welcome-science-active');
                        void scienceLine.offsetWidth;
                        scienceLine.classList.add('welcome-science-active');
                    }
                }

                // Welcome Popup duration: exactly 2.5 seconds.
                const dismissWelcomePopup = () => {
                    if (!popupOverlay || welcomePopupDismissed) return;
                    welcomePopupDismissed = true;
                    popupOverlay.classList.remove('opacity-100');
                    popupOverlay.classList.add('opacity-0', 'pointer-events-none');
                    popupOverlay.style.display = 'none';
                };

                // Clicking the empty/blurred background dismisses the popup immediately.
                if (popupOverlay) {
                    popupOverlay.addEventListener('click', (event) => {
                        if (event.target === popupOverlay) dismissWelcomePopup();
                    });
                }

                setTimeout(() => {
                    dismissWelcomePopup();
                }, 2000);
            }, 500);
        };
    </script>

<script id="inbox-center-notes-script">
(function(){
    let inboxComposerState = { subjectId:null, chapterId:null };
    // Keep unsaved Inbox Composer text independent from Subject/Chapter re-renders.
    let inboxDraftState = { subjectId:null, chapterId:null, heading:'', content:'', contentHtml:'', media:[] };
    let inboxNoteAudioPlayers = {};
    let notificationReturnScrollTop = null;
    window.__notificationReturnScrollTop = window.__notificationReturnScrollTop ?? null;

    function captureInboxDraft() {
        const headingEl = document.getElementById('inbox-note-heading-input');
        const contentEl = document.getElementById('inbox-note-content-input');
        if (headingEl) inboxDraftState.heading = headingEl.value;
        if (contentEl) {
            inboxDraftState.contentHtml = inboxSanitizeContentHtml(contentEl.innerHTML);
            inboxDraftState.content = contentEl.innerText || '';
            inboxDraftState.media = inboxCollectMediaFromContent(contentEl);
        }
        inboxDraftState.subjectId = inboxComposerState.subjectId || null;
        inboxDraftState.chapterId = inboxComposerState.chapterId || null;
    }

    function restoreInboxDraft() {
        const headingEl = document.getElementById('inbox-note-heading-input');
        const contentEl = document.getElementById('inbox-note-content-input');
        if (headingEl) headingEl.value = inboxDraftState.heading || '';
        if (contentEl) {
            contentEl.innerHTML = inboxDraftState.contentHtml || inboxTextToHtml(inboxDraftState.content || '');
            inboxHydrateComposerMedia(contentEl);
        }
    }

    function ensureInboxNotesState(){
        if(!Array.isArray(appState.notes)) appState.notes = [];
        return appState.notes;
    }

    function inboxEscape(value){
        return String(value ?? '').replace(/[&<>"']/g, ch => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
        }[ch]));
    }

    function inboxTextToHtml(text){
        return inboxEscape(text || '').replace(/\n/g,'<br>');
    }

    function inboxSanitizeContentHtml(html){
        const parser = new DOMParser();
        const doc = parser.parseFromString(String(html || ''), 'text/html');
        doc.querySelectorAll('script,style,iframe,object,embed,form,button,input,textarea,select,link,meta').forEach(el=>el.remove());
        doc.querySelectorAll('*').forEach(el=>{
            [...el.attributes].forEach(attr=>{
                if (/^on/i.test(attr.name)) el.removeAttribute(attr.name);
                if (attr.name === 'src' || attr.name === 'href') el.removeAttribute(attr.name);
            });
        });
        doc.querySelectorAll('[data-note-media-key]').forEach(el=>{
            const kind=el.getAttribute('data-note-media-kind');
            const key=el.getAttribute('data-note-media-key');
            if(!key || !/^(image|audio)$/.test(kind || '')) el.remove();
            else {
                el.setAttribute('contenteditable','false');
                el.className='inbox-inline-media';
            }
        });
        return doc.body.innerHTML;
    }

    function inboxCollectMediaFromContent(root){
        return [...root.querySelectorAll('[data-note-media-key]')].map((el,index)=>({
            kind:el.getAttribute('data-note-media-kind') === 'audio' ? 'audio' : 'image',
            storageKey:el.getAttribute('data-note-media-key') || '',
            name:el.getAttribute('data-note-media-name') || ((el.getAttribute('data-note-media-kind') === 'audio' ? 'Audio - #' : 'PIC - #') + (index+1)),
            type:el.getAttribute('data-note-media-type') || (el.getAttribute('data-note-media-kind') === 'audio' ? 'audio/*' : 'image/*')
        })).filter(x=>x.storageKey);
    }

    function inboxMediaLabel(name, kind){
        return inboxEscape(name || (kind === 'audio' ? 'Audio' : 'PIC'));
    }

    async function inboxHydrateComposerMedia(root){
        if(!root) return;
        root.querySelectorAll('[data-note-media-key]').forEach(async el=>{
            const key=el.getAttribute('data-note-media-key');
            const kind=el.getAttribute('data-note-media-kind');
            const name=el.getAttribute('data-note-media-name') || '';
            const type=el.getAttribute('data-note-media-type') || '';
            const blob=await getImageBlob(key).catch(()=>null);
            if(!blob){
                el.innerHTML=`<div class="inbox-inline-media-missing">${kind==='audio'?'No Audio Found':'No Image Found'}</div><div class="inbox-inline-media-label">${inboxMediaLabel(name,kind)}</div>`;
                return;
            }
            const url=URL.createObjectURL(blob);
            if(kind==='image'){
                el.innerHTML=`<img src="${url}" alt="${inboxMediaLabel(name,kind)}"><div class="inbox-inline-media-label">${inboxMediaLabel(name,kind)}</div>`;
            }else{
                el.innerHTML=`<div class="inbox-inline-audio-card" style="--audio-color:${inboxEscape(inboxIsGeneric(inboxComposerState.subjectId) ? INBOX_GENERIC_COLOR : (inboxComposerState.subjectId ? (inboxSubject(inboxComposerState.subjectId)?.themeColor || '#64748b') : '#64748b'))}"><button type="button" class="inbox-inline-audio-play" data-note-audio-key="${inboxEscape(key)}"><i class="fa-solid fa-play text-xs"></i></button><div class="min-w-0 flex-1"><div class="inbox-inline-audio-meta">${inboxMediaLabel(name,kind)}</div><input type="range" min="0" max="100" step="0.1" value="0" class="inbox-inline-audio-seek" data-note-audio-seek="${inboxEscape(key)}" aria-label="Seek ${inboxMediaLabel(name,kind)}"></div></div>`;
                const btn=el.querySelector('[data-note-audio-key]');
                const seek=el.querySelector('[data-note-audio-seek]');
                btn?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();inboxToggleNoteAudio(key,blob,btn,seek);});
                seek?.addEventListener('input',e=>{const p=inboxNoteAudioPlayers[key];if(p&&p.duration)p.currentTime=(Number(e.target.value)/100)*p.duration;});
            }
        });
    }

    async function inboxHydrateViewMedia(root, subjectColor){
        if(!root) return;
        root.querySelectorAll('[data-note-media-key]').forEach(async el=>{
            const key=el.getAttribute('data-note-media-key');
            const kind=el.getAttribute('data-note-media-kind');
            const name=el.getAttribute('data-note-media-name') || '';
            const blob=await getImageBlob(key).catch(()=>null);
            if(!blob){
                el.innerHTML=`<div class="inbox-inline-media-missing">${kind==='audio'?'No Audio Found':'No Image Found'}</div><div class="inbox-inline-media-label">${inboxMediaLabel(name,kind)}</div>`;
                return;
            }
            const url=URL.createObjectURL(blob);
            if(kind==='image'){
                el.innerHTML=`<img src="${url}" alt="${inboxMediaLabel(name,kind)}"><div class="inbox-inline-media-label">${inboxMediaLabel(name,kind)}</div>`;
            }else{
                el.innerHTML=`<div class="inbox-inline-audio-card" style="--audio-color:${inboxEscape(subjectColor || '#64748b')}"><button type="button" class="inbox-inline-audio-play" data-note-audio-key="${inboxEscape(key)}"><i class="fa-solid fa-play text-xs"></i></button><div class="min-w-0 flex-1"><div class="inbox-inline-audio-meta">${inboxMediaLabel(name,kind)}</div><input type="range" min="0" max="100" step="0.1" value="0" class="inbox-inline-audio-seek" data-note-audio-seek="${inboxEscape(key)}" aria-label="Seek ${inboxMediaLabel(name,kind)}"></div></div>`;
                const btn=el.querySelector('[data-note-audio-key]');
                const seek=el.querySelector('[data-note-audio-seek]');
                btn?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();inboxToggleNoteAudio(key,blob,btn,seek);});
                seek?.addEventListener('input',e=>{const p=inboxNoteAudioPlayers[key];if(p&&p.duration)p.currentTime=(Number(e.target.value)/100)*p.duration;});
            }
        });
    }

    async function inboxToggleNoteAudio(key,blob,btn,seek){
        Object.keys(inboxNoteAudioPlayers).forEach(k=>{if(k!==key){try{inboxNoteAudioPlayers[k].pause();}catch(e){};delete inboxNoteAudioPlayers[k];}});
        let player=inboxNoteAudioPlayers[key];
        if(!player){
            player=new Audio(URL.createObjectURL(blob));
            inboxNoteAudioPlayers[key]=player;
            player.addEventListener('timeupdate',()=>{if(seek&&player.duration)seek.value=(player.currentTime/player.duration)*100;});
            player.addEventListener('ended',()=>{if(btn)btn.innerHTML='<i class="fa-solid fa-play text-xs"></i>'; if(seek)seek.value=0; delete inboxNoteAudioPlayers[key];});
        }
        if(player.paused) await player.play(); else player.pause();
        if(btn) btn.innerHTML=`<i class="fa-solid ${player.paused?'fa-play':'fa-pause'} text-xs"></i>`;
    }

    // Stop all inline Inbox Note audio when leaving the note/view modal.
    window.stopAllInboxNoteAudio = function(){
        Object.keys(inboxNoteAudioPlayers).forEach(key=>{
            const player=inboxNoteAudioPlayers[key];
            try{ if(player) player.pause(); }catch(e){}
            try{ if(player) player.currentTime=0; }catch(e){}
            try{ if(player && player.src) URL.revokeObjectURL(player.src); }catch(e){}
            delete inboxNoteAudioPlayers[key];
        });
        document.querySelectorAll('.inbox-inline-audio-play').forEach(btn=>{
            btn.innerHTML='<i class="fa-solid fa-play text-xs"></i>';
        });
        document.querySelectorAll('.inbox-inline-audio-seek').forEach(seek=>{ seek.value=0; });
    };

    function inboxInsertMediaAtCursor(kind, file){
        const editor=document.getElementById('inbox-note-content-input');
        if(!editor || !file) return;
        const selection=window.getSelection();
        let range=null;
        if(selection && selection.rangeCount && editor.contains(selection.anchorNode)) range=selection.getRangeAt(0).cloneRange();
        if(!range){
            range=document.createRange();
            range.selectNodeContents(editor);
            range.collapse(false);
        }
        const block=range.startContainer.nodeType===1 ? range.startContainer.closest?.('div,p') : range.startContainer.parentElement?.closest?.('div,p');
        const storageKey=`inbox:${inboxEditNoteId || 'new'}:${Date.now()}:${Math.random().toString(36).slice(2,7)}`;
        const count=editor.querySelectorAll(`[data-note-media-kind="${kind}"]`).length+1;
        const name=(kind==='audio'?'Audio - #':'PIC - #')+count;
        const wrapper=document.createElement('div');
        wrapper.className='inbox-inline-media';
        wrapper.setAttribute('contenteditable','false');
        wrapper.dataset.noteMediaKey=storageKey;
        wrapper.dataset.noteMediaKind=kind;
        wrapper.dataset.noteMediaName=name;
        wrapper.dataset.noteMediaType=file.type || (kind==='audio'?'audio/*':'image/*');
        wrapper.innerHTML=`<div class="inbox-inline-media-label">${inboxMediaLabel(name,kind)} · loading…</div>`;
        const after=document.createElement('div');
        after.innerHTML='<br>';
        if(block && block !== editor && editor.contains(block)){
            block.insertAdjacentElement('afterend',wrapper);
            wrapper.insertAdjacentElement('afterend',after);
        }else{
            range.insertNode(wrapper);
            wrapper.insertAdjacentElement('afterend',after);
        }
        const newRange=document.createRange();
        newRange.selectNodeContents(after);
        newRange.collapse(true);
        selection?.removeAllRanges(); selection?.addRange(newRange);
        editor.focus();
        saveImageBlob(storageKey,file).then(()=>inboxHydrateComposerMedia(editor));
    }

    window.addInboxPicture=function(){
        const input=document.createElement('input');input.type='file';input.accept='image/*';input.hidden=true;
        input.onchange=()=>{const f=input.files?.[0];if(f)inboxInsertMediaAtCursor('image',f);input.remove();};
        document.body.appendChild(input);input.click();
    };
    window.addInboxAudio=function(){
        const input=document.createElement('input');input.type='file';input.accept='audio/*';input.hidden=true;
        input.onchange=()=>{const f=input.files?.[0];if(f)inboxInsertMediaAtCursor('audio',f);input.remove();};
        document.body.appendChild(input);input.click();
    };

    const INBOX_GENERIC_SUBJECT_ID = '__generic__';
    const INBOX_GENERIC_COLOR = '#9FE2BF';

    function inboxIsGeneric(subjectId){
        return String(subjectId || '') === INBOX_GENERIC_SUBJECT_ID;
    }

    function inboxSubject(subjectId){
        return (appState.subjects || []).find(s => s.id === subjectId) || null;
    }

    function inboxChapter(subject, chapterId){
        return subject && Array.isArray(subject.chapters)
            ? subject.chapters.find(c => c.id === chapterId || String(c.id) === String(chapterId))
            : null;
    }

    function inboxChapterNumber(chapter, subject){
        if(!chapter) return '';
        return chapter.origNum ?? chapter.number ?? chapter.chapterNumber ?? (
            subject && Array.isArray(subject.chapters) ? subject.chapters.indexOf(chapter)+1 : ''
        );
    }

    function inboxDate(value){
        const d = new Date(value);
        if(Number.isNaN(d.getTime())) return '';
        return d.toLocaleString('en-GB',{
            day:'2-digit',month:'short',year:'numeric',
            hour:'2-digit',minute:'2-digit',hour12:true
        });
    }

    function inboxNewId(){
        return 'note_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,9);
    }

    function inboxSortNotes(){
        ensureInboxNotesState();
        appState.notes.sort((a,b) => {
            const bt = new Date(b.savedAt || b.createdAt || 0).getTime();
            const at = new Date(a.savedAt || a.createdAt || 0).getTime();
            return bt-at;
        });
    }

    function inboxSubjectStyle(subject, note){
        const generic = inboxIsGeneric(note?.subjectId);
        const color = generic ? INBOX_GENERIC_COLOR : ((subject && subject.themeColor) || note.subjectColor || '#0284c7');
        const bg = inboxIsGeneric(note?.subjectId) ? '#F0FFF8' : ((subject && subject.bgLight) || note.subjectBgLight || '#f8fafc');
        return `--inbox-color:${inboxEscape(color)};--inbox-bg:${inboxEscape(bg)};--inbox-selected-color:${inboxEscape(color)};--inbox-selected-bg:${inboxEscape(bg)};`;
    }

    function rememberNotificationScrollPosition(){
        const notificationScroller=document.querySelector('#notification-scroll-area');
        if(notificationScroller){
            notificationReturnScrollTop=notificationScroller.scrollTop;
            window.__notificationReturnScrollTop=notificationReturnScrollTop;
        }
    }

    function restoreNotificationScrollPosition(){
        const stored = notificationReturnScrollTop !== null ? notificationReturnScrollTop : window.__notificationReturnScrollTop;
        if(stored === null || stored === undefined) return;
        const savedScrollTop=Number(stored)||0;
        const apply=()=>{
            const scroller=document.getElementById('notification-scroll-area');
            if(scroller) scroller.scrollTop=savedScrollTop;
        };
        requestAnimationFrame(()=>{
            apply();
            requestAnimationFrame(()=>{ apply(); setTimeout(apply,0); });
        });
    }

    window.openInboxCenter = function(){

                    </div>

    function attachInboxSwipeHandlers(){
        const list = document.getElementById('inbox-notes-list');
        if(!list) return;
        list.querySelectorAll('.inbox-note-card[data-note-id]').forEach(card => {
            let startX=0,startY=0,tracking=false;
            card.addEventListener('pointerdown', e => {
                if(e.target.closest('button')) return;
                startX=e.clientX; startY=e.clientY; tracking=true;
            });
            card.addEventListener('pointerup', e => {
                if(!tracking) return;
                tracking=false;
                const dx=e.clientX-startX, dy=e.clientY-startY;
                if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.2){
                    const direction = dx > 0 ? 'right' : 'left';
                    card.style.setProperty('--swipe-direction', direction === 'right' ? '1' : '-1');
                    card.classList.add('inbox-swipe-delete-' + direction);
                    setTimeout(() => showInboxDeleteConfirm(card.dataset.noteId), 320);
                }
            });
            card.addEventListener('pointercancel', () => { tracking=false; });
        });
    }

    function inboxShowMessage(title, message, icon){
        const existing=document.getElementById('inbox-built-in-popup');

            <div class="inbox-built-in-popup" role="dialog" aria-modal="true">

                <div class="inbox-popup-message">${inboxEscape(message)}</div>
                <button type="button" class="inbox-popup-ok">OK</button>
            </div>`;
        document.body.appendChild(overlay);
        const close=()=>{ overlay.classList.add('closing'); setTimeout(()=>overlay.remove(),180); };

    window.saveInboxNote = function(){
        captureInboxDraft();
        const generic=inboxIsGeneric(inboxComposerState.subjectId);
        const subject=inboxSubject(inboxComposerState.subjectId);
        const chapter=generic ? null : inboxChapter(subject,inboxComposerState.chapterId);
        const heading=(document.getElementById('inbox-note-heading-input')?.value||'').trim();
        const contentEl=document.getElementById('inbox-note-content-input');
        const content=(contentEl?.innerText||'').trim();
        const contentHtml=inboxSanitizeContentHtml(contentEl?.innerHTML||'');
        const media=inboxCollectMediaFromContent(contentEl||document.createElement('div'));
        if(!generic && !subject){ inboxShowMessage('Subject Required', 'Please Select Your Subject First...', 'fa-book-open'); return; }
        if(!generic && !chapter){ inboxShowMessage('Chapter Required', 'Please Select Your Chapter First...', 'fa-book'); return; }
        if(!heading){ inboxShowMessage('Heading Required', 'Please Write A Note Heading...', 'fa-heading'); return; }
        if(!content && !media.length){ inboxShowMessage('Note Content Required', 'Please Write Something In The Note Box...', 'fa-note-sticky'); return; }
        ensureInboxNotesState();
        if(inboxEditNoteId){
            const note=appState.notes.find(n=>String(n.id)===String(inboxEditNoteId));
            if(!note) return;
            const now=new Date().toISOString();
            const chapterNo=generic ? null : inboxChapterNumber(chapter,subject);
            note.subjectId=generic ? INBOX_GENERIC_SUBJECT_ID : subject.id;
            note.subjectName=generic ? '' : (subject.enName || subject.name || '');
            note.chapterId=generic ? null : chapter.id;
            note.chapterNumber=chapterNo;
            note.chapterName=generic ? '' : (chapter.name || '');
            note.heading=heading;
            note.content=content;
            note.contentHtml=contentHtml;
            note.media=media;
            note.savedAt=now;
            note.subjectColor=generic ? INBOX_GENERIC_COLOR : (subject.themeColor || '#0284c7');
            note.subjectBgLight=generic ? INBOX_GENERIC_COLOR : (subject.bgLight || '#f8fafc');
            note.metadata={...(note.metadata||{}),type:'inbox-note',version:1,savedAt:now};
            saveStorage();
            const editedId=inboxEditNoteId;
            inboxEditNoteId=null;
            openInboxNoteView(editedId);
            return;
        }
        const now=new Date().toISOString();
        const chapterNo=generic ? null : inboxChapterNumber(chapter,subject);
        appState.notes.unshift({
            id:inboxNewId(),
            subjectId:generic ? INBOX_GENERIC_SUBJECT_ID : subject.id,
            subjectName:generic ? '' : (subject.enName || subject.name || ''),
            chapterId:generic ? null : chapter.id,
            chapterNumber:chapterNo,
            chapterName:generic ? '' : (chapter.name || ''),
            heading:heading,
            content:content,
            contentHtml:contentHtml,
            media:media,
            savedAt:now,
            createdAt:now,
            subjectColor:generic ? INBOX_GENERIC_COLOR : (subject.themeColor || '#0284c7'),
            subjectBgLight:generic ? INBOX_GENERIC_COLOR : (subject.bgLight || '#f8fafc'),
            metadata:{type:'inbox-note',version:1,savedAt:now}
        });
        saveStorage();
        openInboxCenter();
    };;
})();
</script>
</body>
</html>
