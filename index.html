<head>

    <title>SSC Study Tracker - Nadim</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {

    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', 'Hind Siliguri', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Persistent Light/Dark application theme. Light remains the default. */
        html.dark-mode,
        body.dark-mode {
            background-color: #0f172a !important;
            color: #e2e8f0 !important;
        }

        body.dark-mode .bg-white,
        body.dark-mode .bg-white\/80,
        body.dark-mode .bg-white\/90 {
            background-color: #1e293b !important;
        }

        body.dark-mode .bg-slate-50 {
            background-color: #172033 !important;
        }

        body.dark-mode .bg-slate-100 {
            background-color: #263449 !important;
        }

        body.dark-mode .bg-slate-200 {
            background-color: #334155 !important;
        }

        body.dark-mode .text-slate-900,
        body.dark-mode .text-slate-800 {
            color: #f1f5f9 !important;
        }

        body.dark-mode .text-slate-700 {
            color: #e2e8f0 !important;
        }

        body.dark-mode .text-slate-600 {
            color: #cbd5e1 !important;
        }

        body.dark-mode .text-slate-500 {
            color: #94a3b8 !important;
        }

        body.dark-mode .text-slate-400 {
            color: #94a3b8 !important;
        }

        body.dark-mode .border-slate-100 {
            border-color: #334155 !important;
        }

        body.dark-mode .border-slate-200,
        body.dark-mode .border-slate-200\/80,
        body.dark-mode .border-slate-300 {
            border-color: #475569 !important;
        }

        body.dark-mode .border-white {
            border-color: #334155 !important;
        }

        body.dark-mode .glass-card {
            background: rgba(30, 41, 59, 0.94) !important;
            border-color: rgba(71, 85, 105, 0.75) !important;
        }

        body.dark-mode input,
        body.dark-mode select,
        body.dark-mode textarea {
            background-color: #172033 !important;
            color: #f1f5f9 !important;
            border-color: #475569 !important;
        }

        body.dark-mode input::placeholder,
        body.dark-mode textarea::placeholder {
            color: #94a3b8 !important;
        }

        body.dark-mode nav {
            background-color: rgba(15, 23, 42, 0.88) !important;
            border-color: rgba(71, 85, 105, 0.65) !important;
        }

        body.dark-mode #modal-content,
        body.dark-mode #subject-modal-overlay > div {
            background-color: #1e293b !important;
            color: #e2e8f0 !important;
        }

        body.dark-mode .chapter-importance-name-indicator {
            background: rgba(30, 41, 59, 0.98) !important;
            border-color: #475569 !important;
            color: #f1f5f9 !important;
        }

        body.dark-mode .chapter-importance-name-indicator::after {
            background: #1e293b !important;
            border-right-color: #475569 !important;
            border-bottom-color: #475569 !important;
        }

        body.dark-mode ::-webkit-scrollbar-track {
            background: #172033;
        }

        body.dark-mode ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        /* Dark mode readability fixes: only neutral UI surfaces/text are remapped.
           Subject-specific colors and inline theme colors remain unchanged. */
        body.dark-mode .text-slate-900,
        body.dark-mode .text-slate-800 {
            color: #f8fafc !important;
        }
        body.dark-mode .text-slate-700 {
            color: #e2e8f0 !important;
        }
        body.dark-mode .text-slate-600 {
            color: #cbd5e1 !important;
        }
        body.dark-mode .text-slate-500,
        body.dark-mode .text-slate-400 {
            color: #94a3b8 !important;
        }

        /* Keep chapter-importance number badges clearly visible and rounded in Dark mode. */
        body.dark-mode .building-bar {
            border-radius: inherit;
        }
        body.dark-mode #building-chart-container span.rounded-md {
            border-radius: 0.375rem !important;
        }

        /* Dark surfaces for common white/slate cards without touching subject-colored surfaces. */
        body.dark-mode .bg-white,
        body.dark-mode .bg-white\/80,
        body.dark-mode .bg-white\/90 {
            background-color: #1e293b !important;
        }
        body.dark-mode .bg-slate-50 {
            background-color: #172033 !important;
        }
        body.dark-mode .bg-slate-100 {
            background-color: #263449 !important;
        }

        /* Preserve colored subject/chapter cards, bars, badges and progress indicators
           by allowing inline background/color values to win. */
        body.dark-mode [style*="background-color:"],
        body.dark-mode [style*="background:"],
        body.dark-mode [style*="color:"] {
            /* Intentionally empty: this selector documents that inline theme colors are preserved. */
        }

        body.dark-mode .chapter-importance-value-badge {
            border-radius: 0.375rem !important;
            background-color: #1e293b !important;
            border-color: #475569 !important;
        }


        /* Dark-mode notification chapter-name colors: preserve semantic status colors and keep them readable. */
        body.dark-mode .notification-chapter-zero {
            color: #f43f5e !important;
        }
        body.dark-mode .notification-chapter-attention {
            color: #38bdf8 !important;
        }
        body.dark-mode .notification-chapter-finished {
            color: #34d399 !important;
        }

        /* Overall Growth remains distinctly turquoise in Dark mode. */
        body.dark-mode .overall-growth-title,
        body.dark-mode .overall-growth-text {
            color: #2dd4bf !important;
        }

        /* Chapter Importance graph blocks always retain rounded corners in Dark mode. */
        body.dark-mode #building-chart-container .building-bar {
            border-radius: 0.5rem !important;
        }
        body.dark-mode #building-chart-container .chapter-importance-value-badge {
            border-radius: 0.375rem !important;
        }

        /* Theme selector: keep the original horizontal length, but make the buttons slimmer vertically. */
        .settings-theme-option {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            justify-self: stretch;
        }

        /* Settings Name Fields: keep both inputs balanced side-by-side and safely clipped for long names. */
        .settings-name-input {
            min-width: 0;
            max-width: 100%;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            text-overflow: clip;
            box-sizing: border-box;
        }

        .settings-name-input::-webkit-scrollbar {
            height: 0;
        }

        .settings-name-input {
            scrollbar-width: none;
        }

        /* Settings theme selector */
        .settings-theme-option {
            min-height: 58px;
        }

        .settings-theme-option.selected {
            box-shadow: 0 0 0 2px #F8B337 inset, 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .building-bar {
            transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s ease, opacity 0.2s ease;
        }

        /* Chapter Importance Graph: animate only the blocks, without changing card/page layout. */
        @keyframes chapterImportanceRise {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .chapter-importance-rise {
            animation: chapterImportanceRise 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-fill-mode: both;
            will-change: transform;
        }

        /* Click-to-reveal chapter name for the Chapter Importance Graph. */
        .chapter-importance-click-target {
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .chapter-importance-name-indicator {
            position: absolute;
            left: 50%;
            bottom: var(--chapter-indicator-bottom, 30px);
            --chapter-indicator-shift: 0px;
            --chapter-indicator-arrow-shift: 0px;
            transform: translateX(calc(-50% + var(--chapter-indicator-shift))) translateY(4px);
            z-index: 20;
            width: max-content;
            max-width: min(160px, 46vw);
            padding: 3px 7px;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(226, 232, 240, 0.95);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
            color: #334155;
            font-size: 9px;
            line-height: 1.25;
            font-weight: 700;
            text-align: center;
            white-space: normal;
            pointer-events: none;
            opacity: 0;
            animation: chapterNameIndicatorIn 144ms ease-out forwards;
        }

        .chapter-importance-name-indicator::after {
            content: "";
            position: absolute;
            left: calc(50% - var(--chapter-indicator-arrow-shift));
            bottom: -5px;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.96);
            border-right: 1px solid rgba(226, 232, 240, 0.95);
            border-bottom: 1px solid rgba(226, 232, 240, 0.95);
            transform: translateX(-50%) rotate(45deg);
        }

        @keyframes chapterNameIndicatorIn {
            from { opacity: 0; transform: translateX(calc(-50% + var(--chapter-indicator-shift))) translateY(4px) scale(0.96); }
            to { opacity: 1; transform: translateX(calc(-50% + var(--chapter-indicator-shift))) translateY(0) scale(1); }
        }

        /* Scoped text/icon animations: preserve layout dimensions while animating. */
        .home-greeting-text,
        .dashboard-heading-text {
            display: inline-block;
            white-space: nowrap;
            overflow: visible;
            vertical-align: bottom;
            flex: 0 0 auto;
            max-width: none;
        }

        @keyframes settingsGear360 {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .settings-gear-enter-animation {
            animation: settingsGear360 1.2s cubic-bezier(0.4, 0, 0.2, 1) 1;
            transform-origin: center center;
        }

        /* AI WELCOME POPUP STYLES */
        @keyframes borderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .animate-spin-slow {
            animation: borderRotate 2s linear infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.95; }
        }

        .animate-pulse-glow {
            animation: pulseGlow 1.5s ease-in-out infinite;
        }

        @keyframes accessDeniedWiggle {
            0%, 100% { transform: translateX(0) rotate(0deg) scale(1); }
            20% { transform: translateX(-3px) rotate(-1deg) scale(1.03); }
            40% { transform: translateX(3px) rotate(1deg) scale(1.04); }
            60% { transform: translateX(-2px) rotate(-0.8deg) scale(1.03); }
            80% { transform: translateX(2px) rotate(0.8deg) scale(1.02); }
        }

        .settings-access-denied-title {
            animation: accessDeniedWiggle 0.7s ease-in-out infinite;
        }

        /* Password visibility field: slightly larger masking dots only */
        .password-field-dots {
            font-size: 15px !important;
            letter-spacing: 0.02em;
        }

        .settings-password-eye-active {
            background-color: rgba(248, 179, 55, 0.14) !important;
            color: #F8B337 !important;
            border-color: rgba(248, 179, 55, 0.35) !important;
            box-shadow: 0 0 10px rgba(248, 179, 55, 0.25);
        }

        .chapter-complete-check { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:9999px; color:#fff; background:#16a34a; font-size:10px; flex-shrink:0; }
        .chapter-complete-badge { display:inline-flex; width:15px; height:15px; flex:0 0 15px; align-items:center; justify-content:center; margin-left:.8em; vertical-align:-0.16em; position:relative; transform:rotate(-6deg); filter:drop-shadow(0 2px 3px rgba(22,163,74,.20)); transition:transform .2s ease, filter .2s ease; }

        .chapter-complete-badge::before { content:""; position:absolute; inset:-2px; border:1.5px dotted #22c55e; border-radius:50%; pointer-events:none; }
        .chapter-complete-badge:hover { transform:rotate(-6deg) scale(1.08); filter:drop-shadow(0 3px 5px rgba(22,163,74,.28)); }
        .chapter-complete-badge svg { width:15px; height:15px; display:block; overflow:visible; }
        @keyframes overallGrowthShift { 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }
        .overall-growth-panel { background:linear-gradient(135deg,rgba(220,255,241,.58),rgba(229,248,255,.58),rgba(255,240,223,.58),rgba(238,231,255,.58)); background-size:240% 240%; animation:overallGrowthShift 12s ease-in-out infinite; border:none !important; box-shadow:none !important; -webkit-backdrop-filter:blur(17px); backdrop-filter:blur(17px); }

        /* Custom Dynamic Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            border-radius: 9999px;
            background: #e2e8f0;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: var(--slider-color, #0284c7);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.1s ease;
        }

        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.15);
        }

        input[type=range]::-moz-range-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            border-radius: 9999px;
            background: #e2e8f0;
        }

        input[type=range]::-moz-range-thumb {
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: var(--slider-color, #0284c7);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.1s ease;
        }

        input[type=range]::-moz-range-thumb:active {
            transform: scale(1.15);
        }
    
        /* IMPORT DATA UPLOAD ANIMATION — centered, larger, animation-only */
        .import-upload-animation-card{width:min(430px,92vw);margin:0 auto;padding:0;background:transparent!important;border:0!important;box-shadow:none!important;text-align:center}
        .import-upload-stage{position:relative;width:min(82vw,360px);height:270px;margin:0 auto;display:flex;align-items:center;justify-content:center;overflow:visible}
        .import-storage-box{position:relative;width:230px;height:190px;border-radius:26px;border:2px solid rgba(16,185,129,.30);background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(240,253,244,.96));box-shadow:0 22px 55px rgba(16,185,129,.18),inset 0 1px 0 rgba(255,255,255,.9);transform:none;overflow:visible}
        .import-storage-top{position:absolute;left:18px;right:18px;top:-12px;height:30px;border-radius:12px 12px 8px 8px;background:linear-gradient(180deg,#ecfdf5,#d1fae5);border:2px solid rgba(16,185,129,.28);box-shadow:0 7px 16px rgba(16,185,129,.12);z-index:5}
        .import-storage-slot{position:absolute;left:50%;top:7px;width:96px;height:8px;transform:translateX(-50%);border-radius:999px;background:rgba(5,150,105,.18)}
        .import-storage-glow{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 55%,rgba(16,185,129,.24),transparent 62%);opacity:0;animation:importStorageGlow 2.1s ease-in-out 1.05s forwards;z-index:1}
        .import-storage-label{position:absolute;left:16px;right:16px;bottom:22px;z-index:7;font-size:12px;font-weight:900;color:#047857}
        .import-upload-success-fill{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(16,185,129,.06),rgba(34,197,94,.26));transform:scaleY(0);transform-origin:bottom;animation:importStorageGreenFill .75s cubic-bezier(.22,.8,.3,1) 1.12s forwards;z-index:2}
        .import-upload-file{position:absolute;left:50%;top:58%;width:142px;height:174px;transform:translate(-50%,112px);z-index:10;animation:importFileFlyIntoStorage 1.12s cubic-bezier(.18,.78,.25,1) .08s forwards}
        .import-upload-file-paper{position:relative;width:100%;height:100%;padding:32px 15px 16px;border-radius:16px;background:linear-gradient(150deg,#fff,#f0fdf4);border:2px solid rgba(16,185,129,.28);box-shadow:0 18px 35px rgba(15,23,42,.16),0 8px 18px rgba(16,185,129,.12);overflow:hidden}
        .import-upload-file-fold{position:absolute;right:-1px;top:-1px;width:42px;height:42px;background:linear-gradient(135deg,#d1fae5 0%,#ecfdf5 58%,transparent 59%);border-left:2px solid rgba(16,185,129,.18);border-bottom:2px solid rgba(16,185,129,.18);border-radius:0 0 0 9px}
        .import-upload-file-icon{width:42px;height:42px;margin:0 auto 10px;border-radius:12px;display:grid;place-items:center;background:rgba(16,185,129,.12);color:#059669;font-size:19px}
        .import-upload-file-title{text-align:center;font-size:12px;line-height:1.2;font-weight:900;color:#065f46}
        .import-upload-file-line{width:72%;height:5px;margin:12px auto 0;border-radius:999px;background:rgba(16,185,129,.14)}
        .import-upload-file-line.short{width:48%;margin-top:7px}
        .import-upload-success-ring{position:absolute;left:50%;top:50%;width:78px;height:78px;transform:translate(-50%,-50%) scale(.45);border-radius:50%;border:3px solid rgba(16,185,129,.24);opacity:0;z-index:9;animation:importSuccessRing .7s ease-out 1.55s forwards}
        .import-upload-check{position:absolute;left:50%;top:50%;width:66px;height:66px;transform:translate(-50%,-50%) scale(.5);border-radius:50%;display:grid;place-items:center;background:#10b981;color:#fff;font-size:31px;box-shadow:0 10px 28px rgba(16,185,129,.28);opacity:0;z-index:11;animation:importSuccessCheck .58s cubic-bezier(.2,.9,.25,1.2) 1.58s forwards}
        .import-upload-animation-card>.space-y-1{display:none!important}
        @keyframes importFileFlyIntoStorage{0%{transform:translate(-50%,112px) scale(.88);opacity:0}18%{opacity:1}78%{transform:translate(-50%,-22px) scale(1);opacity:1}100%{transform:translate(-50%,-4px) scale(.72);opacity:0}}
        @keyframes importStorageGreenFill{0%{transform:scaleY(0);opacity:.2}100%{transform:scaleY(1);opacity:1}}
        @keyframes importStorageGlow{0%{opacity:0}100%{opacity:1}}
        @keyframes importSuccessRing{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}45%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.32)}}
        @keyframes importSuccessCheck{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
        @keyframes importOneSecondLoader{to{transform:rotate(360deg)}}
        @media (prefers-reduced-motion:reduce){.import-upload-file,.import-storage-glow,.import-upload-success-fill,.import-upload-success-ring,.import-upload-check{animation-duration:.0.8ms!important;animation-iteration-count:1!important;animation-delay:0ms!important}}
        
        /* Import animation cleanup + premium loading state */
        .import-upload-animation-card,
        .import-upload-animation-card * {
            scrollbar-width: none !important;
        }
        .import-upload-animation-card::-webkit-scrollbar,
        .import-upload-animation-card *::-webkit-scrollbar {
            display: none !important;
        }
        .import-upload-premium-loader-wrap {
            width: 100%;
            margin-top: 82px;
            text-align: center;
        }
        .import-upload-premium-loader {
            position: relative;
            width: 88px;
            height: 88px;
            margin: 0 auto;
        }
        .import-upload-premium-loader-track {
            position: absolute;
            inset: 5px;
            border: 9px solid rgba(16,185,129,.13);
            border-radius: 50%;
        }
        .import-upload-premium-loader-arc {
            position: absolute;
            inset: 5px;
            border: 9px solid transparent;
            border-top-color: #10b981;
            border-right-color: #34d399;
            border-radius: 50%;
            transform: rotate(-35deg);
            animation: importPremiumLoaderSpin .72s linear infinite;
            filter: drop-shadow(0 4px 8px rgba(16,185,129,.22));
        }
        .import-upload-premium-loader-arc::before,
        .import-upload-premium-loader-arc::after {
            content: "";
            position: absolute;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #10b981;
        }
        .import-upload-premium-loader-arc::before {
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
        }
        .import-upload-premium-loader-arc::after {
            right: -9px;
            top: 50%;
            transform: translateY(-50%);
            background: #34d399;
        }
        .import-upload-backup-status {
            margin-top: 18px;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: .01em;
            color: #059669;
            white-space: nowrap;
        }
        .import-upload-backup-dots {
            display: inline-block;
            width: 24px;
            text-align: left;
            letter-spacing: 2px;
        }
        @keyframes importPremiumLoaderSpin {
            to { transform: rotate(325deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .import-upload-premium-loader-arc {
                animation-duration: .0.8ms !important;
                animation-iteration-count: 1 !important;
            }
        }

        
        /* FINAL IMPORT ANIMATION CLEANUP — show only the rounded main animation box */
        .import-upload-animation-card {
            width: min(430px,92vw) !important;
            height: 270px !important;

    <script>
        const DATA_VERSION = 8;

        // Persistent app-private image storage. Images are stored as Blobs in IndexedDB,
        // so deleting the original file from Gallery/File Manager does not remove the app copy.
        const IMAGE_DB_NAME = 'nadim_study_tracker_images';
        const IMAGE_DB_VERSION = 1;
        const IMAGE_STORE = 'images';
        let imageDb = null;
        let profileObjectUrl = '';
        const coverObjectUrls = {};

        // Temporary image state for the current Settings session.
        // These previews are intentionally NOT written to IndexedDB until
        // Save & Apply Changes is authenticated successfully.
        let pendingProfileImageBlob = null;
        let pendingProfileImageObjectUrl = '';
        const pendingCoverImageBlobs = {};
        const pendingCoverImageObjectUrls = {};
        let settingsSessionActive = false;

        // Preserve the nested Book Covers scroll only for temporary upload/delete re-renders.
        // Permanent-image deletion intentionally keeps its existing behavior unchanged.
        let pendingBookCoversScrollRestore = null;

        function captureBookCoversScrollPosition() {
            const modalContent = document.getElementById('modal-content');
            const bookCoversList = document.getElementById('settings-book-covers-list');
            pendingBookCoversScrollRestore = {
                modalTop: modalContent ? modalContent.scrollTop : 0,
                listTop: bookCoversList ? bookCoversList.scrollTop : 0
            };
        }

        function restoreBookCoversScrollPosition() {
            const restore = pendingBookCoversScrollRestore;
            if (!restore) return;
            pendingBookCoversScrollRestore = null;

            requestAnimationFrame(() => {
                const modalContent = document.getElementById('modal-content');
                const bookCoversList = document.getElementById('settings-book-covers-list');
                if (modalContent) modalContent.scrollTop = restore.modalTop;
                if (bookCoversList) bookCoversList.scrollTop = restore.listTop;

                requestAnimationFrame(() => {
                    if (modalContent) modalContent.scrollTop = restore.modalTop;
                    if (bookCoversList) bookCoversList.scrollTop = restore.listTop;
                });
            });
        }

        function getNotificationStatus() {
            let unstudiedCount = 0;
            let attentionCount = 0;
            let finishedCount = 0;

            appState.subjects.forEach(sub => {
                (sub.chapters || []).forEach(ch => {
                    const pct = getChapterProgress(ch, sub.id);
                    if (pct === 0) unstudiedCount++;
                    else if (pct < 100) attentionCount++;
                    else if (pct === 100) finishedCount++;
                });
            });

            let colorClass = '';
            if (unstudiedCount > 0) colorClass = 'bg-rose-500';
            else if (attentionCount > 0) colorClass = 'bg-sky-500';
            else if (finishedCount > 0) colorClass = 'bg-emerald-500';

            return { unstudiedCount, attentionCount, finishedCount, colorClass };
        }

        function getNotificationDotHtml() {
            const status = getNotificationStatus();
            return status.colorClass
                ? `<span class="absolute -top-0.5 -right-0.5 w-3.5 h-3.5 rounded-full ${status.colorClass} border-2 border-white shadow-sm -top-1 -right-1" aria-label="Notification status"></span>`
                : '';
        }

        function getOverallGrowthMotivationalSentence() {
            const name = appState.user.welcomeName || 'NADIM';
            const sentences = {
                6: `${name} Believe You Can And You're Halfway There !`,
                0: `${name} Push Yourself , Because No One Else Is Going To Do It For You !`,
                1: `${name} Difficult Roads Often Lead To Beautiful Destinations !`,
                2: `${name} The Work You Do Today , Creates The Person You Meet Tomorrow !`,
                3: `${name} Small Daily Improvements Over Time Lead To Stunning Results !`,
                4: `${name} Don't Stop When You Are Tired ; Stop When You Are Done !`,
                5: `${name} Hard Times Often Open The Doors To Success !`
            };
            return `${name}, ${sentences[new Date().getDay()].replace(`${name} `, '')}`;
        }

        function openImageDB() {
            if (imageDb) return Promise.resolve(imageDb);
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(IMAGE_DB_NAME, IMAGE_DB_VERSION);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains(IMAGE_STORE)) db.createObjectStore(IMAGE_STORE);
                };
                request.onsuccess = () => { imageDb = request.result; resolve(imageDb); };
                request.onerror = () => reject(request.error);
            });
        }

        async function saveImageBlob(key, blob) {
            const db = await openImageDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IMAGE_STORE, 'readwrite');
                tx.objectStore(IMAGE_STORE).put(blob, key);
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            });
        }

        async function getImageBlob(key) {
            const db = await openImageDB();
            return new Promise((resolve, reject) => {
                const req = db.transaction(IMAGE_STORE, 'readonly').objectStore(IMAGE_STORE).get(key);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
            });
        }

        async function hydrateStoredImages() {
            try {
                const keys = ['profile', ...appState.subjects.map(sub => 'cover:' + sub.id)];
                const blobs = await Promise.all(keys.map(key => getImageBlob(key).catch(() => null)));
                const profileBlob = blobs[0];

                if (profileBlob) {
                    if (profileObjectUrl) URL.revokeObjectURL(profileObjectUrl);
                    profileObjectUrl = URL.createObjectURL(profileBlob);
                }

                appState.subjects.forEach((sub, idx) => {
                    const blob = blobs[idx + 1];
                    if (blob) {
                        if (coverObjectUrls[sub.id]) URL.revokeObjectURL(coverObjectUrls[sub.id]);
                        coverObjectUrls[sub.id] = URL.createObjectURL(blob);
                    }
                });
            } catch (e) {
                console.error('Image storage error:', e);
            }
        }

        function clearPendingProfileImage() {
            pendingProfileImageBlob = null;
            if (pendingProfileImageObjectUrl) {
                URL.revokeObjectURL(pendingProfileImageObjectUrl);
                pendingProfileImageObjectUrl = '';
            }
        }

        function clearPendingCoverImage(subId) {
            if (pendingCoverImageObjectUrls[subId]) {
                URL.revokeObjectURL(pendingCoverImageObjectUrls[subId]);
                delete pendingCoverImageObjectUrls[subId];
            }
            delete pendingCoverImageBlobs[subId];
        }

        function discardPendingImages() {
            clearPendingProfileImage();
            Object.keys(pendingCoverImageObjectUrls).forEach(subId => clearPendingCoverImage(subId));
        }

        async function commitPendingImages() {
            if (pendingProfileImageBlob) {
                await saveImageBlob('profile', pendingProfileImageBlob);
                if (profileObjectUrl) URL.revokeObjectURL(profileObjectUrl);
                profileObjectUrl = pendingProfileImageObjectUrl;
                pendingProfileImageObjectUrl = '';
                pendingProfileImageBlob = null;
            }

            for (const subId of Object.keys(pendingCoverImageBlobs)) {
                await saveImageBlob('cover:' + subId, pendingCoverImageBlobs[subId]);
                if (coverObjectUrls[subId]) URL.revokeObjectURL(coverObjectUrls[subId]);
                coverObjectUrls[subId] = pendingCoverImageObjectUrls[subId];
                pendingCoverImageObjectUrls[subId] = '';
                delete pendingCoverImageBlobs[subId];
            }
        }

        async function handleProfilePhotoUpload(input) {
            const file = input?.files?.[0];
            if (!file || !file.type.startsWith('image/')) return;
            try {
                clearPendingProfileImage();
                pendingProfileImageBlob = file;
                pendingProfileImageObjectUrl = URL.createObjectURL(file);
                renderSettingsContent();
            } catch (e) {
                console.error('Profile photo preview failed:', e);
                clearPendingProfileImage();
                alert('Profile Photo Preview করা যায়নি। আবার চেষ্টা করুন।');
            }
            input.value = '';
        }

        async function handleBookCoverUpload(subId, input) {
            const file = input?.files?.[0];
            if (!file || !file.type.startsWith('image/')) return;
            try {
                captureBookCoversScrollPosition();
                clearPendingCoverImage(subId);
                pendingCoverImageBlobs[subId] = file;
                pendingCoverImageObjectUrls[subId] = URL.createObjectURL(file);
                renderSettingsContent();
                restoreBookCoversScrollPosition();
            } catch (e) {
                console.error('Book cover preview failed:', e);
                clearPendingCoverImage(subId);
                alert('Book Cover Preview করা যায়নি। আবার চেষ্টা করুন।');
            }
            input.value = '';
        }

        async function deleteStoredImageKey(key) {
            const db = await openImageDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IMAGE_STORE, 'readwrite');
                tx.objectStore(IMAGE_STORE).delete(key);
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            });
        }

            if (type === 'cover' && subId && pendingCoverImageBlobs[subId]) {
                captureBookCoversScrollPosition();
            }
            const sub = subId ? appState.subjects.find(s => s.id === subId) : null;
            const subjectName = sub?.name || '';
            const message = type === 'profile'
                ? 'আপনি কি আপনার Profile Photo-টি সত্যিই delete করতে চান?'
                : `আপনি কি ‘${subjectName}’-এর Book Cover-টি সত্যিই delete করতে চান?`;
            const contentHtml = `
                <div class="space-y-5 text-center">
                    <div class="mx-auto w-14 h-14 rounded-2xl bg-red-50 text-red-500 flex items-center justify-center">
                        <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                    </div>
                    <div class="space-y-2">
                        <h3 class="text-base font-extrabold text-slate-800">Warning / Notice</h3>

                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" onclick="cancelImageDeleteConfirmation()"
                            class="w-full py-3.5 bg-slate-100 text-slate-700 font-bold text-sm rounded-xl shadow-sm active:scale-95 transition-all">Cancel</button>
                        <button type="button" onclick="requestImageDeletePassword('${type}', '${subId || ''}')"
                            class="w-full py-3.5 bg-red-500 text-white font-bold text-sm rounded-xl shadow-md active:scale-95 transition-all">Delete</button>
                    </div>
                </div>`;
            showModal(contentHtml);
        }

        function cancelImageDeleteConfirmation() {
            if (settingsSessionActive) {
                renderSettingsContent();
                if (pendingBookCoversScrollRestore) restoreBookCoversScrollPosition();
            } else {
                closeModal();
            }
        }

        function requestImageDeletePassword(type, subId = '') {
            // A pending upload is only a temporary Settings-session change.
            // Deleting it must NOT ask for a password and must keep the user on this Settings page.
            const hasPending = type === 'profile'
                ? !!pendingProfileImageBlob
                : !!pendingCoverImageBlobs[subId];

            if (hasPending) {
                if (type === 'profile') clearPendingProfileImage();
                else clearPendingCoverImage(subId);
                closeModal();
                if (settingsSessionActive) {
                    renderSettingsContent();
                    if (type === 'cover') restoreBookCoversScrollPosition();
                } else if (appState.activeTab === 'home') {
                    renderHome();
                } else {
                    renderDashboard();
                }
                return;
            }

            // No pending upload means the image is already permanently saved.
            // Permanent deletion remains password-protected.
            showSettingsPasswordPopup(`deleteImage:${type}:${subId}`);
        }

        async function verifyImageDeletePassword(action) {
            const input = document.getElementById('settings-password-input');
            if (!input) return;
            const correctPassword = 'TryToStayCalm!!';
            if (input.value !== correctPassword) {
                const dialog = document.getElementById('settings-password-dialog');
                if (dialog) {
                    const inputWrap = input.parentElement;
                    if (inputWrap) inputWrap.classList.add('hidden');
                    document.getElementById('settings-password-submit')?.classList.add('hidden');
                    const title = document.getElementById('settings-password-title');
                    if (title) {
                        title.textContent = 'Oops !… Access Denied !';
                        title.classList.remove('text-base');
                        title.classList.add('text-lg', 'text-red-500', 'settings-access-denied-title');
                    }
                    document.getElementById('settings-password-error')?.classList.remove('hidden');
                }
                return;
            }

            const [, type, subId] = action.split(':');
            try {
                const key = type === 'profile' ? 'profile' : 'cover:' + subId;

                // This password-confirmed path is ONLY for an already-permanent image.
                // Any pending image is handled before opening the password popup.
                await deleteStoredImageKey(key);
                if (type === 'profile') {
                    if (profileObjectUrl) URL.revokeObjectURL(profileObjectUrl);
                    profileObjectUrl = '';
                } else if (coverObjectUrls[subId]) {
                    URL.revokeObjectURL(coverObjectUrls[subId]);
                    delete coverObjectUrls[subId];
                }

                // Permanent deletion is a completed, authenticated action.
                // Unlike temporary deletion, it intentionally returns to Home.
                discardPendingImages();
                settingsStateSnapshot = null;
                closeModal();
                appState.activeTab = 'home';
                switchTab('home');
                const welcomeImg = document.getElementById('welcome-profile-img');
                if (welcomeImg) welcomeImg.src = getStoredProfileImageSrc();
            } catch (e) {
                console.error('Image delete failed:', e);
                showBackupMessagePopup('Warning / Error', 'ছবিটি delete করা যায়নি। আবার চেষ্টা করুন।', 'OK', 'fa-triangle-exclamation', 'text-red-600', 'bg-red-500');
            }
        }

        // Helper function for smooth countdown number animation
        function animateNumber(elementId, startVal, endVal, duration = 1200, animationToken = null) {
            const element = document.getElementById(elementId);
            if (!element) return;
            
            let startTimestamp = null;
            const step = (timestamp) => {
                if (animationToken !== null && animationToken !== dashboardCountdownAnimationToken) return;
                const currentElement = document.getElementById(elementId);
                if (!currentElement) return;
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // Ease-out cubic formula for natural deceleration
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const current = Math.floor(startVal - (startVal - endVal) * easeOut);
                currentElement.textContent = current;
                
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    currentElement.textContent = endVal;
                }
            };
            window.requestAnimationFrame(step);
        }

        function normalizeBangla1ChapterStructure(subjects) {
            (subjects || []).forEach(sub => {
                if (sub.id !== 'ban1' || !Array.isArray(sub.chapters)) return;
                sub.chapters.forEach(ch => {
                    if (ch.origNum >= 31 && ch.origNum <= 32) {
                        delete ch.mcqTarget; delete ch.mcqSolved; delete ch.mcqPastCount;
                    }
                    if (![3,4,5,7,8,9,10,11,12,13,17,20,23,27,28,29].includes(ch.origNum)) {
                        delete ch.cqPastCount; delete ch.mcqPastCount;
                    }
                });
            });
        }
        normalizeBangla1ChapterStructure(DEFAULT_SUBJECTS);
        const BANGLA1_PRIORITY_CHAPTERS = [3,4,5,7,8,9,10,11,12,13,17,20,23,27,28,29];

        let progressGraphMode = 'week';
        // Keep the last navigation position independently for Week and Month views,
        // so switching views never resets the user's place in either graph.
        let monthOffset = 0;
        let lastWeekGraphOffset = 0;
        let lastMonthGraphOffset = 0;

        let appState = {
            dataVersion: DATA_VERSION,
            user: {
                name: 'নাদিম হোসেন',
                welcomeName: 'NADIM',
                
                subtitle: 'Start Your Study Soon'

            dates: {
                testExam: '2026-11-01',
                sscExam: '2027-03-15'
            },
            activeTab: 'home',
            theme: 'light',

            dailyLogs: {},
            weekOffset: 0,
            notes: []
        };

        function loadStorage() {
            const stored = localStorage.getItem('nadim_study_tracker_data');
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    if (parsed) {
                        if (!parsed.dataVersion || parsed.dataVersion < DATA_VERSION) {
                            parsed.subjects = DEFAULT_SUBJECTS;
                            parsed.dataVersion = DATA_VERSION;
                        } else if (parsed.subjects) {
                            DEFAULT_SUBJECTS.forEach((defSub) => {
                                const found = parsed.subjects.find(s => s.id === defSub.id);
                                if (found) {
                                    defSub.chapters = found.chapters || defSub.chapters;
                                }
                            });
                            parsed.subjects = DEFAULT_SUBJECTS;
                        }
                        parsed.subjects.forEach(s => { if (Object.prototype.hasOwnProperty.call(s, 'cover' + 'Url')) delete s['cover' + 'Url']; });
                        parsed.user = parsed.user || {};
                        parsed.user.name = (typeof parsed.user.name === 'string' && parsed.user.name.trim()) ? parsed.user.name : 'নাদিম হোসেন';
                        parsed.user.welcomeName = (typeof parsed.user.welcomeName === 'string' && parsed.user.welcomeName.trim()) ? parsed.user.welcomeName : 'NADIM';
                        delete parsed.user['profile' + 'ImageUrl'];
                        parsed.user.subtitle = parsed.user.subtitle || 'Start Your Study Soon';
                        // Theme is a persistent application preference.
                        // Only a valid saved theme is restored; otherwise Light is the default.
                        parsed.theme = parsed.theme === 'dark' ? 'dark' : 'light';
                        appState = parsed;
                        normalizeBangla1ChapterStructure(appState.subjects);
                        sanitizeRevisionEntries(appState);
                        // Revision count is additive and backward-compatible with existing saved/imported data.
                        (appState.subjects || []).forEach(sub => {
                            (sub.chapters || []).forEach(ch => {
                                const count = Number(ch.revisionCount);
                                ch.revisionCount = Number.isFinite(count) && count > 0 ? Math.floor(count) : 0;
                                if (!Array.isArray(ch.revisionHistory)) ch.revisionHistory = [];
                                ch.revisionHistory = ch.revisionHistory.map((rev, idx) => ({
                                    ...(rev && typeof rev === 'object' ? rev : {}),
                                    number: idx + 1,
                                    progress: Number.isFinite(Number(rev?.progress)) ? Math.max(0, Math.min(100, Number(rev.progress))) : 0
                                }));
                                if (ch.revisionHistory.length > 0) ch.revisionCount = ch.revisionHistory.length;
                                // Preserve a chapter's real completion moment for FINISHED ordering.
                                // Older saved data may not have this field; lastStudied is used only
                                // as a deterministic legacy fallback for already-completed chapters.
                                const savedCompletion = Number(ch.completionTimestamp);
                                if (Number.isFinite(savedCompletion) && savedCompletion > 0) {
                                    ch.completionTimestamp = savedCompletion;
                                } else if (getChapterProgress(ch, s.id) >= 100 && ch.lastStudied) {
                                    const legacyCompletion = Date.parse(ch.lastStudied);
                                    ch.completionTimestamp = Number.isFinite(legacyCompletion) ? legacyCompletion : null;
                                } else {
                                    ch.completionTimestamp = null;
                                }
                            });
                        });
                        if (!appState.dailyLogs || typeof appState.dailyLogs !== 'object' || Array.isArray(appState.dailyLogs)) {
                            appState.dailyLogs = {};
                        }
                        appState.weekOffset = 0;
                        saveStorage();
                    }
                } catch(e) { console.error('Data parsing error', e); }
            } else {
                saveStorage();
            }
        }

        // --- HISTORICAL GRAPH DATE HELPERS ---
        // Monthly availability is based on the actual valid dates present in dailyLogs,
        // not on how much real-world time has passed since the app was installed/used.
        function parseValidDateKey(dateKey) {
            if (typeof dateKey !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return null;
            const [y, m, d] = dateKey.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            if (date.getFullYear() !== y || date.getMonth() !== m - 1 || date.getDate() !== d) return null;
            date.setHours(0, 0, 0, 0);
            return date;
        }

        function getHistoricalDateRange() {
            const keys = Object.keys(appState.dailyLogs || {});
            const dates = keys.map(parseValidDateKey).filter(Boolean).sort((a, b) => a - b);
            if (!dates.length) return null;
            return { first: dates[0], last: dates[dates.length - 1] };
        }

        function getInclusiveDateDays(first, last) {
            return Math.floor((last - first) / (1000 * 60 * 60 * 24)) + 1;
        }

        function getDaysInMonth(year, monthIndex) {
            return new Date(year, monthIndex + 1, 0).getDate();
        }

        function hasOneFullCalendarMonthOfHistory() {
            const range = getHistoricalDateRange();
            if (!range) return false;
            const requiredDays = getDaysInMonth(range.first.getFullYear(), range.first.getMonth());
            return getInclusiveDateDays(range.first, range.last) >= requiredDays;
        }

        function getLatestHistoricalDate() {
            return getHistoricalDateRange()?.last || null;
        }

        function getMonthStartDate(date, offset = 0) {
            return new Date(date.getFullYear(), date.getMonth() + offset, 1);
        }

        function getMonthlyGraphDates(offset = 0) {
            const latest = getLatestHistoricalDate();
            if (!latest) return [];
            const monthStart = getMonthStartDate(latest, offset);
            const days = getDaysInMonth(monthStart.getFullYear(), monthStart.getMonth());
            return Array.from({ length: days }, (_, i) => new Date(monthStart.getFullYear(), monthStart.getMonth(), i + 1));
        }

        function getMonthlyGraphBounds() {
            const range = getHistoricalDateRange();
            if (!range) return { minOffset: 0, maxOffset: 0 };
            const latestMonthIndex = range.last.getFullYear() * 12 + range.last.getMonth();
            const firstMonthIndex = range.first.getFullYear() * 12 + range.first.getMonth();
            return { minOffset: firstMonthIndex - latestMonthIndex, maxOffset: 0 };
        }

        // Week navigation follows the app's Saturday → Friday calendar week.
        // The earliest reachable week is determined by the first valid Progress
        // History record in imported/local dailyLogs data.
        function getWeekStartForDate(date) {
            const start = new Date(date);
            start.setHours(0, 0, 0, 0);
            const daysFromSaturday = (start.getDay() + 1) % 7;
            start.setDate(start.getDate() - daysFromSaturday);
            return start;
        }

        function getCalendarDaySerial(date) {
            return Math.floor(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / (1000 * 60 * 60 * 24));
        }

        function getWeeklyGraphBounds() {
            const range = getHistoricalDateRange();
            if (!range) return { minOffset: 0, maxOffset: 0 };
            const latestWeekStart = getWeekStartForDate(range.last);
            const firstWeekStart = getWeekStartForDate(range.first);
            const weekDifference = Math.floor((getCalendarDaySerial(firstWeekStart) - getCalendarDaySerial(latestWeekStart)) / 7);
            return { minOffset: weekDifference, maxOffset: 0 };
        }

        function getHistoricalBoundaryMonthName() {
            const range = getHistoricalDateRange();
            return range ? range.first.toLocaleDateString('en-US', { month: 'long' }) : '';
        }

        function getMonthLabel(date) {
            return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        }

        function applyAppTheme(theme) {
            const safeTheme = theme === 'dark' ? 'dark' : 'light';
            document.documentElement.classList.toggle('dark-mode', safeTheme === 'dark');
            document.body.classList.toggle('dark-mode', safeTheme === 'dark');
            document.documentElement.classList.toggle('dark', safeTheme === 'dark');
            document.documentElement.classList.toggle('light', safeTheme !== 'dark');
        }

        function getPendingTheme() {
            return (pendingSettingsState && pendingSettingsState.theme) || appState.theme || 'light';
        }

        function selectAppTheme(theme) {
            const safeTheme = theme === 'dark' ? 'dark' : 'light';
            if (pendingSettingsState) {
                // Preview immediately, but keep the real saved state untouched
                // until the user successfully saves with the Settings password.
                pendingSettingsState.theme = safeTheme;
                applyAppTheme(safeTheme);
            } else {
                appState.theme = safeTheme;
                saveStorage();
                applyAppTheme(safeTheme);
            }
            renderSettingsContent();
        }

        function saveStorage() {
            if (!appState.dailyLogs || typeof appState.dailyLogs !== 'object' || Array.isArray(appState.dailyLogs)) {
                appState.dailyLogs = {};
            }
            if (!Array.isArray(appState.notes)) {
                appState.notes = [];
            }
            // Persist the selected application theme together with the rest of the app data.
            const storageSnapshot = JSON.parse(JSON.stringify(appState));
            sanitizeRevisionEntries(storageSnapshot);
            storageSnapshot.theme = appState.theme === 'dark' ? 'dark' : 'light';
            localStorage.setItem('nadim_study_tracker_data', JSON.stringify(storageSnapshot));
        }

        // --- CHAPTER & SUBJECT PROGRESS CALCULATIONS ---
        function getChapterProgress(ch, subId) {
            if (!ch) return 0;
            const studyAvg = ((ch.study.book || 0) + (ch.study.class || 0) + (ch.study.summary || 0) + (ch.study.notes || 0)) / 4;
            const mcqPct = ch.mcqTarget > 0 ? Math.min(100, (ch.mcqSolved / ch.mcqTarget) * 100) : 0;

            if (subId === 'ban2') {
                return Math.min(100, (studyAvg + mcqPct) / 2);
            }

            const isBan1FinalChapter = subId === 'ban1' && ch.origNum >= 31 && ch.origNum <= 32;
            const hasSqSegment = !isBan1FinalChapter;
            const sqPct = hasSqSegment && ch.sqTarget > 0 ? Math.min(100, (ch.sqSolved / ch.sqTarget) * 100) : 0;
            const cqPct = ch.cqTarget > 0 ? Math.min(100, (ch.cqSolved / ch.cqTarget) * 100) : 0;
            if (isBan1FinalChapter) return Math.min(100, (studyAvg + cqPct) / 2);
            if (subId === 'ict') return Math.min(100, (studyAvg + mcqPct + sqPct) / 3);
            return Math.min(100, (studyAvg + cqPct + mcqPct + sqPct) / 4);
        }

        function getSubjectProgress(sub) {
            if (!sub.chapters || sub.chapters.length === 0) return 0;
            const sumPct = sub.chapters.reduce((acc, ch) => acc + getChapterProgress(ch, sub.id), 0);
            const rawAvg = sumPct / sub.chapters.length;

            if (sub.id === 'ban2') {
                return rawAvg * 0.30;
            }
            return rawAvg;
        }

        function OverallSSCProgress() {
            let totalEarned = 0;
            appState.subjects.forEach(sub => {
                totalEarned += getSubjectProgress(sub);
            });
            return (totalEarned / 930) * 100;
        }

        function getTotalCompletedChapters() {
            let count = 0;
            appState.subjects.forEach(s => {
                s.chapters.forEach(ch => {
                    if (getChapterProgress(ch, s.id) >= 99.9) count++;
                });
            });
            return count;
        }

        function getTotalCompletedSubjects() {
            return appState.subjects.filter(s => {
                const prog = getSubjectProgress(s);
                return s.id === 'ban2' ? prog >= 29.9 : prog >= 99.9;
            }).length;
        }

        function getDaysRemaining(targetDateStr) {
            const today = new Date();
            today.setHours(0,0,0,0);
            const target = new Date(targetDateStr);
            const diffTime = target - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays > 0 ? diffDays : 0;
        }

        // --- SCOPED PAGE-ENTRY ANIMATION STATE ---
        let homeGreetingTimer = null;
        let homeGreetingRunToken = 0;
        let dashboardHeadingAnimationPending = false;
        let dashboardHeadingAnimationToken = 0;
        let dashboardCountdownAnimationToken = 0;
        let settingsGearAnimationPending = false;

        function stopHomeGreetingAnimation() {
            homeGreetingRunToken++;
            if (homeGreetingTimer) {
                clearTimeout(homeGreetingTimer);
                homeGreetingTimer = null;
            }
        }

        function runHomeSubtitleAnimation(animationName, duration) {
            const subtitle = document.getElementById('home-subtitle-text');
            if (!subtitle) return;
            const safeDuration = Math.max(1, Math.round(duration));
            subtitle.style.setProperty('--home-subtitle-animation-duration', `${safeDuration}ms`);
            subtitle.classList.remove('home-subtitle-dive', 'home-subtitle-float');
            // Force a fresh animation frame without changing the existing greeting timing.
            void subtitle.offsetWidth;
            subtitle.classList.add(animationName);
        }

        function startHomeGreetingAnimation() {
            stopHomeGreetingAnimation();
            const runToken = homeGreetingRunToken;
            const delayBetweenCycles = 5000;
            // Typing/deleting speed: 40 ms per character.
            const stepDelay = 44;

            const getGreetingElement = () => document.getElementById('home-greeting-text');
            const getGreetingText = () => {
                const name = appState.user.name || 'নাদিম হোসেন';
                return `Hey ${name}`;
            };

            const prepareFixedWidth = (el, fullText) => {
                if (!el) return;
                const measure = document.createElement('span');
                measure.textContent = fullText;
                measure.style.cssText = `
                    position:absolute;
                    visibility:hidden;
                    white-space:nowrap;
                    font:inherit;
                    letter-spacing:inherit;
                `;
                document.body.appendChild(measure);
                const width = Math.ceil(measure.getBoundingClientRect().width);
                measure.remove();
                // Reserve the complete text width so repeated cycles never
                // progressively clip or shrink the greeting.
                el.style.width = `${width}px`;
                el.style.minWidth = `${width}px`;
                el.style.maxWidth = 'none';
                el.style.overflow = 'visible';
            };

            const runCycle = () => {
                if (runToken !== homeGreetingRunToken || appState.activeTab !== 'home') return;

                const el = getGreetingElement();
                const fullText = getGreetingText();
                if (!el) {
                    homeGreetingTimer = setTimeout(runCycle, 250);
                    return;
                }

                prepareFixedWidth(el, fullText);
                el.textContent = fullText;

                // Synchronize only the new subtitle effect to the existing deletion phase.
                const deleteDuration = Math.max(1, (fullText.length - 1) * stepDelay);
                runHomeSubtitleAnimation('home-subtitle-dive', deleteDuration);

                const deleteNext = () => {
                    if (runToken !== homeGreetingRunToken || appState.activeTab !== 'home') return;
                    const current = el.textContent || '';
                    if (current.length > 0) {
                        el.textContent = current.slice(0, -1);
                        homeGreetingTimer = setTimeout(deleteNext, stepDelay);
                    } else {
                        typeNext();
                    }
                };

                const typeNext = () => {
                    if (runToken !== homeGreetingRunToken || appState.activeTab !== 'home') return;
                    if ((el.textContent || '').length === 0) {
                        const typeDuration = Math.max(1, (fullText.length - 1) * stepDelay);
                        runHomeSubtitleAnimation('home-subtitle-float', typeDuration);
                    }
                    const current = el.textContent || '';
                    if (current.length < fullText.length) {
                        el.textContent = fullText.slice(0, current.length + 1);
                        homeGreetingTimer = setTimeout(typeNext, stepDelay);
                    } else {
                        homeGreetingTimer = setTimeout(runCycle, delayBetweenCycles);
                    }
                };

                deleteNext();
            };

            // Required initial five-second pause after Home entry.
            homeGreetingTimer = setTimeout(runCycle, delayBetweenCycles);
        }

        function animateDashboardHeading() {
            const el = document.getElementById('dashboard-heading-text');
            if (!el) return;
            const fullText = 'Dashboard & Analytics';
            const runToken = ++dashboardHeadingAnimationToken;

            // Measure using the actual rendered heading font before clearing any text.
            // The parent box therefore receives its final width from the very first frame.
            const measure = document.createElement('span');
            measure.textContent = fullText;
            measure.style.cssText = `
                position:absolute;
                visibility:hidden;
                display:inline-block;
                white-space:nowrap;
                font:inherit;
                letter-spacing:inherit;
            `;
            document.body.appendChild(measure);
            const width = Math.ceil(measure.getBoundingClientRect().width);
            measure.remove();

            // Keep the full heading width during the typing animation.
            // The outer heading box has a fixed width from the first frame.
            // Fill that box instead of letting the typing animation resize it.
            el.style.width = '100%';
            el.style.minWidth = '100%';
            el.style.maxWidth = '100%';
            el.style.overflow = 'visible';
            el.textContent = '';
            let index = 0;
            const step = () => {
                if (runToken !== dashboardHeadingAnimationToken) return;
                const current = document.getElementById('dashboard-heading-text');
                if (!current) return;
                index++;
                current.textContent = fullText.slice(0, index);
                if (index < fullText.length) setTimeout(step, 6);
            };
            requestAnimationFrame(step);
        }

        function switchTab(tabName) {
            const previousTab = appState.activeTab;
            // Leaving Dashboard cancels any in-progress graph animation. Whenever
            // Dashboard is entered from another page, always start from This Week /
            // This Month so the animation is based on the real current period,
            // regardless of where the user last navigated.
            if (tabName === 'home') {
                if (activeProgressGraphAnimationCancel) activeProgressGraphAnimationCancel();
                progressGraphAnimationToken++;

                // Home entry always starts a fresh five-second typing-animation cycle.
                if (previousTab !== 'home') startHomeGreetingAnimation();
            } else if (previousTab !== 'dashboard') {
                // Leaving Home must stop/reset its animation timer.
                if (previousTab === 'home') stopHomeGreetingAnimation();
                if (activeProgressGraphAnimationCancel) activeProgressGraphAnimationCancel();
                appState.weekOffset = 0;
                monthOffset = 0;
                lastWeekGraphOffset = 0;
                lastMonthGraphOffset = 0;
            }
            appState.activeTab = tabName;
            // Home keeps the existing extra bottom breathing room so its last content
            // remains fully usable above the fixed navigation bar. Dashboard keeps the
            // original body bottom spacing.
            document.body.classList.remove('pb-24', 'pb-[112px]', 'pb-[136px]');
            document.body.classList.add(
                tabName === 'home' ? 'pb-[136px]' : 'pb-[128px]'
            );
            const homeBtn = document.getElementById('nav-home');
            const dashBtn = document.getElementById('nav-dashboard');
            const homeIcon = document.getElementById('nav-home-icon');
            const dashIcon = document.getElementById('nav-dashboard-icon');

            if (tabName === 'home') {
                homeBtn.className = "flex flex-col items-center gap-1 text-sky-600 font-semibold transition-all duration-200";
                homeIcon.className = "w-10 h-10 rounded-full flex items-center justify-center bg-[#ccfff9] text-sky-600 shadow-sm";
                dashBtn.className = "flex flex-col items-center gap-1 text-slate-400 font-medium hover:text-slate-600 transition-all duration-200";
                dashIcon.className = "w-10 h-10 rounded-full flex items-center justify-center bg-transparent text-slate-400";
                renderHome();
            } else {
                dashBtn.className = "flex flex-col items-center gap-1 text-sky-600 font-semibold transition-all duration-200";
                dashIcon.className = "w-10 h-10 rounded-full flex items-center justify-center bg-[#ccfff9] text-sky-600 shadow-sm";
                homeBtn.className = "flex flex-col items-center gap-1 text-slate-400 font-medium hover:text-slate-600 transition-all duration-200";
                homeIcon.className = "w-10 h-10 rounded-full flex items-center justify-center bg-transparent text-slate-400";
                renderDashboard(previousTab !== 'dashboard', previousTab !== 'dashboard', previousTab !== 'dashboard');

                // Countdown animation runs only when Dashboard is entered from another page.
                // Internal Dashboard re-renders (graph/filter/selector interactions) do not replay it.
                if (previousTab !== 'dashboard' && welcomePopupDismissed) {
                    const sscWeeks = Math.floor(getDaysRemaining(appState.dates.sscExam) / 7);
                    const testWeeks = Math.floor(getDaysRemaining(appState.dates.testExam) / 7);
                    const countdownRunToken = dashboardCountdownAnimationToken;
                    animateNumber('dash-ssc-weeks-num', 62, sscWeeks, 1200, countdownRunToken);
                    animateNumber('dash-test-weeks-num', 42, testWeeks, 1200, countdownRunToken);
                }
            }

            // Home <-> Dashboard navigation always starts the newly opened page at the top.
            // This does not affect internal page/modal scroll restoration behavior.
            requestAnimationFrame(() => {
                window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;
            });
        }

        // --- RENDER HOME PAGE ---

            const completedChaps = getTotalCompletedChapters();

                        </div>
                    </div>

                        <i class="fa-regular fa-bell text-lg"></i>
                        ${getNotificationDotHtml()}
                    </button>
                </div>

                <!-- MAIN OVERVIEW CARD (Turquoise #66FFD9 Color Card) -->
                <div class="rounded-3xl p-6 shadow-xl shadow-teal-500/10 relative overflow-hidden" style="background-color: #66FFD9;">
                    <div class="absolute -right-8 -bottom-8 w-36 h-36 bg-white/20 rounded-full blur-xl"></div>
                    <div class="flex items-center justify-between gap-4">
                        <div class="relative w-28 h-28 flex items-center justify-center flex-shrink-0">
                            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                <path class="text-slate-900/15" stroke-width="3.8" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />

        function animateHomeCircularProgress() {
            const totalPath = document.getElementById('home-total-progress-circle');
            const totalPercent = document.getElementById('home-total-progress-percent');

            // Keep the Home Total Progress circle and percentage mathematically synchronized.
            if (totalPath && totalPercent) {
                const target = parseFloat(totalPath.getAttribute('data-progress-target') || '0');
                const duration = 444;
                const startTime = performance.now();
                totalPath.setAttribute('stroke-dasharray', '0, 100');
                totalPercent.textContent = '0%';

                const animateTotal = (timestamp) => {
                    const progress = Math.min((timestamp - startTime) / duration, 1);
                    // Use the same linear progress value for both, keeping speed uniform from start to finish.
                    const currentValue = target * progress;

                    totalPath.setAttribute('stroke-dasharray', `${currentValue}, 100`);
                    totalPercent.textContent = `${Math.floor(currentValue)}%`;

                    if (progress < 1) {
                        requestAnimationFrame(animateTotal);
                    } else {
                        totalPath.setAttribute('stroke-dasharray', `${target}, 100`);
                        totalPercent.textContent = `${Math.round(target)}%`;
                    }
                };

                requestAnimationFrame(animateTotal);
            }

            // Keep all Home Subject Card circular progress animations unchanged.
            document.querySelectorAll('.home-subject-progress-circle').forEach(path => {
                const finalDasharray = path.getAttribute('data-final-dasharray') || '0, 100';
                path.setAttribute('stroke-dasharray', '0, 100');
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        path.setAttribute('stroke-dasharray', finalDasharray);
                    });
                });
            });
        }

            // Animate ONLY on a normal chapter entry (not temporary progress re-renders).
            // For 16%+ progress, the bar visibly grows from 0% in exactly four equal jumps.
            if (!isTemp && Number(chPct) >= 12) {
                const targetProgress = Math.min(100, Math.max(0, Number(chPct) || 0));
                const progressBar = document.getElementById('chapter-detail-progress-fill');
                if (progressBar) {
                    progressBar.style.width = '0%';
                    progressBar.style.transition = 'none';
                    // Wait until the modal has actually been painted before starting.
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            const bar = document.getElementById('chapter-detail-progress-fill');
                            if (!bar) return;
                            const step = targetProgress / 3;
                            bar.style.transition = 'width 180ms cubic-bezier(.22,1,.36,1)';

                            const go = (n) => {
                                const current = document.getElementById('chapter-detail-progress-fill');
                                const track = document.getElementById('chapter-detail-progress-track');
                                if (!current || !track) return;

                                const segmentStart = ((n - 1) * step);
                                const segmentWidth = step;

                                // First load this quarter of the progress bar.
                                current.style.width = `${Math.min(targetProgress, segmentWidth * n)}%`;

                                // Then a separate block falls straight down onto that exact quarter.
                                const impact = document.createElement('span');
                                impact.className = 'chapter-progress-step-impact';
                                impact.style.left = `${segmentStart}%`;
                                impact.style.width = `${segmentWidth}%`;
                                track.appendChild(impact);

                                setTimeout(() => impact.remove(), 245);
                            };

                            // Four gravity-like blocks: one after another, side-by-side,
                            // each landing on its own equal progress segment.
                            go(1);
                            setTimeout(() => go(2), 220);
                            setTimeout(() => go(3), 440);
                        });
                    });
                }
            }

        function getLocalDateKey(date = new Date()) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // Daily history is the source of truth for the Weekly Graph. Each save
        // records only the change made today, so repeated edits remain consistent.
        function recordDailyActivityDelta(beforeChapter, afterChapter) {
            if (!appState.dailyLogs || typeof appState.dailyLogs !== 'object' || Array.isArray(appState.dailyLogs)) {
                appState.dailyLogs = {};
            }
            const delta = {
                cq: (Number(afterChapter?.cqSolved) || 0) - (Number(beforeChapter?.cqSolved) || 0),
                mcq: (Number(afterChapter?.mcqSolved) || 0) - (Number(beforeChapter?.mcqSolved) || 0),
                sq: (Number(afterChapter?.sqSolved) || 0) - (Number(beforeChapter?.sqSolved) || 0)
            };
            if (!delta.cq && !delta.mcq && !delta.sq) return;

            const key = getLocalDateKey();
            const log = appState.dailyLogs[key] && typeof appState.dailyLogs[key] === 'object'
                ? appState.dailyLogs[key]
                : { cq: 0, mcq: 0, sq: 0, total: 0 };
            log.cq = Math.max(0, (Number(log.cq) || 0) + delta.cq);
            log.mcq = Math.max(0, (Number(log.mcq) || 0) + delta.mcq);
            log.sq = Math.max(0, (Number(log.sq) || 0) + delta.sq);
            log.total = log.cq + log.mcq + log.sq;
            log.lastUpdated = new Date().toISOString();
            appState.dailyLogs[key] = log;
        }

        function saveChapterProgress(subId, chId) {
            const sub = appState.subjects.find(s => s.id === subId);
            const realCh = sub?.chapters.find(c => c.id === chId);
            if (realCh && tempChapterState) {
                const beforeChapter = JSON.parse(JSON.stringify(realCh));
                const beforePct = getChapterProgress(beforeChapter, sub.id);
                Object.assign(realCh, tempChapterState);
                const afterPct = getChapterProgress(realCh, sub.id);

                // Record the exact moment a chapter first crosses into 100% completion.
                // Keep an existing completion timestamp when the chapter is edited while
                // remaining at 100%, and clear it only when the chapter falls below 100%.
                if (afterPct >= 100) {
                    if (!(beforePct >= 100) || !Number.isFinite(Number(realCh.completionTimestamp)) || Number(realCh.completionTimestamp) <= 0) {
                        realCh.completionTimestamp = Date.now();
                    }
                } else if (beforePct >= 100) {
                    realCh.completionTimestamp = null;
                }

                recordDailyActivityDelta(beforeChapter, realCh);
                realCh.lastStudied = getLocalDateKey();
                // Keep the existing date field for compatibility, while recording
                // the exact moment of the latest progress update for Overview YourSelf.
                realCh.progressUpdatedAt = Date.now();
                saveStorage();
            }
            openSubjectModal(subId);
            if (appState.activeTab === 'home') renderHome();
            else renderDashboard();
        }

        function getChapterCompletionTimestamp(ch) {
            if (!ch) return 0;
            const value = Number(ch.completionTimestamp);
            if (Number.isFinite(value) && value > 0) return value;
            if (ch.lastStudied) {
                const legacy = Date.parse(ch.lastStudied);
                if (Number.isFinite(legacy)) return legacy;
